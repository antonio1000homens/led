AWSTemplateFormatVersion: '2010-09-09'
Description: Bootstrap GitHub OIDC deployment roles and dedicated Lambda artifact storage for LED.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider ARN for token.actions.githubusercontent.com.
  RepoOwner:
    Type: String
    Default: antonio1000homens
  RepoOwnerId:
    Type: String
    Default: '36929120'
    Description: Immutable GitHub owner ID used in the OIDC subject claim.
  RepoName:
    Type: String
    Default: led
  RepoId:
    Type: String
    Default: '1367515704'
    Description: Immutable GitHub repository ID used in the OIDC subject claim.
  DeployBranch:
    Type: String
    Default: master

Resources:
  CodeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub led-code-${AWS::Region}-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CodeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CodeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt CodeBucket.Arn
              - !Sub ${CodeBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LedCloudFormationExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: led-cloudformation-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RuntimeRoleCreate
                Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/led-*
              - Sid: RuntimeRoleManage
                Effect: Allow
                Action:
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/led-*
              - Sid: RuntimeRolePass
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/led-*
              - Sid: ReadLambdaArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${CodeBucket.Arn}/led/*
              - Sid: HostingBucketCreate
                Effect: Allow
                Action: s3:CreateBucket
                Resource: '*'
              - Sid: HostingBucketManage
                Effect: Allow
                Action:
                  - s3:DeleteBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:PutBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}
              - Sid: HostingObjectsManage
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}/*
              - Sid: LambdaCreate
                Effect: Allow
                Action: lambda:CreateFunction
                Resource: '*'
              - Sid: LambdaManage
                Effect: Allow
                Action:
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetFunctionConcurrency
                  - lambda:GetPolicy
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:PutFunctionConcurrency
                  - lambda:DeleteFunctionConcurrency
                Resource: !Sub arn:aws:lambda:eu-west-2:${AWS::AccountId}:function:led-*
              - Sid: ApiGatewayV2Manage
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                  - apigateway:UntagResource
                Resource: '*'
              - Sid: RuntimeConfigTableManage
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:DeleteTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescribeContinuousBackups
                Resource: !Sub arn:aws:dynamodb:eu-west-2:${AWS::AccountId}:table/led-runtime-config
              - Sid: SchedulerManage
                Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                  - scheduler:GetScheduleGroup
                  - scheduler:ListTagsForResource
                  - scheduler:TagResource
                  - scheduler:UntagResource
                Resource:
                  - !Sub arn:aws:scheduler:eu-west-2:${AWS::AccountId}:schedule/default/led-*
                  - !Sub arn:aws:scheduler:eu-west-2:${AWS::AccountId}:schedule-group/default
              - Sid: LogsList
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              - Sid: LogsManage
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                Resource: !Sub arn:aws:logs:eu-west-2:${AWS::AccountId}:log-group:/aws/lambda/led-*
              - Sid: CloudFrontCreate
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:ListDistributions
                  - cloudfront:ListOriginAccessControls
                Resource: '*'
              - Sid: CloudFrontManage
                Effect: Allow
                Action:
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                Resource: '*'

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubActionsLedDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${RepoOwner}@${RepoOwnerId}/${RepoName}@${RepoId}:ref:refs/heads/${DeployBranch}
      Policies:
        - PolicyName: led-github-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:eu-west-2:${AWS::AccountId}:stack/led-*/*
                  - !Sub arn:aws:cloudformation:eu-west-2:${AWS::AccountId}:changeSet/*/*
              - Sid: CloudFormationReadGlobal
                Effect: Allow
                Action:
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: CodeBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt CodeBucket.Arn
              - Sid: UploadLambdaArtifact
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${CodeBucket.Arn}/led/*
              - Sid: PublishStaticContent
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}
              - Sid: PublishStaticObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}/index.html
                  - !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}/admin
                  - !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}/admin.html
                  - !Sub arn:aws:s3:::led-alf-broadcast-prod-${AWS::AccountId}/api/screens
              - Sid: InvokePublisher
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:eu-west-2:${AWS::AccountId}:function:led-publisher
              - Sid: CloudFrontReadInvalidate
                Effect: Allow
                Action:
                  - cloudfront:GetDistribution
                  - cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: CertificateManagement
                Effect: Allow
                Action:
                  - acm:AddTagsToCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:RequestCertificate
                Resource: '*'
              - Sid: CallerIdentity
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'

Outputs:
  AwsRoleToAssume:
    Value: !GetAtt GitHubActionsDeployRole.Arn
  CloudFormationRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  CodeBucketName:
    Value: !Ref CodeBucket
