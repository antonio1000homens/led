t(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.18)}.queue-card{grid-column:1/-1}.schedule-window{display:grid;grid-template-columns:minmax(90px,1fr) 92px 112px auto;gap:8px;align-items:center;margin:8px 0}.feed-section{grid-column:1/-1}.feed-section>h2{font-size:1.15rem;margin:8px 0 4px}.section-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card-head{display:flex;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.card h2{font-size:1.08rem;margin:0 0 4px}.provider{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card-body{padding:18px}.field{display:grid;grid-template-columns:minmax(0,1fr) 122px;gap:12px;align-items:center;margin:12px 0}.field label{font-size:.92rem}.field small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px}.switch{justify-self:end;position:relative;width:48px;height:27px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#344151;transition:.16s}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:white;border-radius:50%;transition:.16s}.switch input:checked+.slider{background:#1978aa}.switch input:checked+.slider:before{transform:translateX(21px)}input[type=number],select{width:100%;background:#0b1119;border:1px solid #34475b;border-radius:8px;padding:8px 9px;color:inherit;font:inherit}input:focus,button:focus,summary:focus{outline:2px solid var(--accent);outline-offset:2px}.queue-intro{max-width:780px}.queue-parks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:20px}.queue-park{border:1px solid #26394c;border-radius:12px;background:#0d151e;padding:14px}.queue-park-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.queue-park h3{font-size:.98rem;margin:0}.rides{margin <body><main>
<header class="topbar"><div><div class="eyebrow">Runtime control plane</div><h1>LED administration</h1><p>Operational settings apply without a deployment. Authentication is provided by Cloudflare Access.</p></div><div class="toolbar"><span class="badge" id="global-health"><span class="dot"></span><span>Loading</span></span><button id="refresh" type="button">Refresh</button></div></header>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="workspace">
<button type="button" id="nav-toggle" class="mobile-nav-toggle" aria-expanded="false" aria-controls="nav-panel">☰ Browse screens</button>
<div id="nav-scrim" class="nav-scrim" hidden></div>
<aside id="nav-panel" class="nav-panel" aria-label="Administration navigation">
<div class="nav-heading">Screens &amp; settings</div>
<label class="nav-search-label" for="nav-search">Find a screen</label>
<input id="nav-search" class="nav-search" type="search" placeholder="Search screens" autocomplete="off">
<nav id="section-navigation" aria-label="Screen and maintenance sections"></nav>
<p id="nav-empty" class="nav-empty" hidden>No matching screens.</p>
</aside>
<div class="workspace-main">
<div class="content-heading"><div id="breadcrumb" class="breadcrumb">Overview</div><h2 id="section-title" tabindex="-1">Overview</h2><p id="section-subtitle" class="meta"></p></div>
<section id="cards" class="grid" aria-busy="true"></section>
<details id="maintenance-diagnostics" class="advanced" hidden><summary>Advanced diagnostics</summary><pre id="diagnostics">Loading…</pre></details>
</div></div>
<script>
const API='/api/control/v1';
const cards=document.getElementById('cards'),notice=document.getElementById('notice'),diagnostics=document.getElementById('diagnostics'),health=document.getElementById('global-health');
let state={config:null,status:null,selected:{}};
function showNotice(message,kind=''){notice.textContent=message;notice.className='notice show '+kind;}
function clearNotice(){notice.className='notice';notice.textContent='';}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
async function api(path,options={}){const response=await fetch(API+path,{cache:'no-store',credentials:'same-origin',...options,headers:{'Accept':'application/json',...(options.headers||{})}});let data={};try{data=await response.json()}catch(e){}if(!response.ok){if(response.status===401)throw new Error('Cloudflare Access authentication is required or has expired.');if(response.status===412)throw new Error('Configuration changed elsewhere. Refresh before saving.');throw new Error(data.error||`Request failed (${response.status})`);}return {data,etag:response.headers.get('etag')};}
function formatTime(value){if(!value)return 'Never';const date=new Date(value);return Number.isNaN(date.valueOf())?value:date.toLocaleString();}
function fieldHtml(feedId,field,value,schema){if(field==='schedule_windows')return scheduleWindowsHtml(feedId,value);const meta=schema.fields[field]||{};const labels={brightness_percent:['Brightness','apparent LED brightness; changes apply to the MatrixPortal'],enabled:['Enabled','stops polling and removes output when off'],poll_seconds:['Polling interval','seconds between provider refreshes'],screen_duration_seconds:['Screen duration','seconds this screen remains visible'],cron_schedule:['Cron schedule','five-field cron in Europe/London; blank means always active. Example: 0 8 * * 1-5'],overview_enabled:['7-day overview','show the existing seven-day forecast screen'],today_enabled:['Next 24 hours · six blocks','show six rolling four-hour forecast snapshots starting with Now'],today_duration_seconds:['Next 24 hours duration','seconds the rolling next-24-hour screen remains visible'],sun_enabled:['Sunrise / sunset','show today\'s sunrise and sunset screen'],sun_duration_seconds:['Sunrise / sunset duration','seconds the solar-times screen remains visible'],visible_task_count:['Todoist tasks','total tasks to retain and rotate through'],intro_text:['Scouts intro message','text shown beside the animated camping tent; default: Be Prepared for...'],station_scroll_speed:['Station scroll speed','pixels per second'],station_list_spacing:['Station spacing','pixels between individual stations'],upcoming_train_count:['Upcoming trains','number of trains to cycle'],upcoming_train_pause_seconds:['Train cycle pause','seconds to hold before the next train'],no_services_duration_seconds:['No services duration','seconds to display the empty departures page'],animation_speed:['Animation speed','pixels per second from right to left'],words:['Trailing words','text that follows behind the steam train'],queue_scroll_speed:['Queue scroll speed','pixels per second when rows slide upward'],queue_scroll_pause_seconds:['Queue pause','seconds to hold each queue viewport before scrolling'],splash_enabled:['Splash screen','slide the park name in, flash, then reveal queue data'],layout_mode:['SL7 display layout','Split: Heathrow-bound left, New Malden-bound right; or legacy separate pages']};if(feedId==='recycling'&&field==='enabled')labels.enabled=['Enabled','show eligible Home Assistant recycling snapshots; unrelated MQTT screens and reminders are unaffected'];if(feedId==='recycling'&&field==='slide_speed')labels.slide_speed=['Scrolling speed','pixels per second for collection labels'];if(feedId==='flash'&&field==='enabled')labels.enabled=['Enabled','starts MQTT polling; disabling disconnects the board'];if(feedId==='steam_train'&&field==='enabled')labels.enabled=['Enabled','show this animation immediately before Departures'];if(feedId==='sl7_bus'&&field==='bus_intro_enabled')labels.bus_intro_enabled=['Bus introduction','show an animated bus before each enabled SL7 stop'];if(feedId==='sl7_bus'&&field==='animation_speed')labels.animation_speed=['Bus animation speed','pixels per second from right to left'];if(feedId==='football_fixtures'&&field==='animation_speed')labels.animation_speed=['Football slide speed','pixels per second from right to left; lower values move the fixture more slowly'];if(feedId==='sl7_bus'&&field==='words')labels.words=['Bus trailing words','text following the animated bus (e.g. Beep! Beep!...)'];if(field==='screen_duration_seconds'&&feedId==='queue_times')labels.screen_duration_seconds=['Screen duration','seconds for the complete Queue-Times block'];if(field==='screen_duration_seconds'&&feedId==='weather')labels.screen_duration_seconds=['7-day overview duration','seconds the 7-day overview remains visible'];if(feedId==='today'&&field==='enabled')labels.enabled=['Enabled','show the standalone current-conditions screen without changing Weather forecasts or polling'];if(feedId==='today'&&field==='screen_duration_seconds')labels.screen_duration_seconds=['Today screen duration','seconds the standalone current-conditions screen remains visible'];const [label,unit]=labels[field]||[field.replaceAll('_',' '),''];if(meta.type==='boolean')return `<div class="field"><label id="${feedId}-${field}-label">${label}<small>${unit}</small></label><label class="switch"><input data-field="${field}" type="checkbox" ${value?'checked':''} aria-labelledby="${feedId}-${field}-label"><span class="slider"></span></label></div>`;if(meta.type==='string')return `<div class="field"><label for="${feedId}-${field}">${label}<small>${unit}</small></label><input id="${feedId}-${field}" data-field="${field}" type="text" maxlength="${meta.maximumLength||80}" value="${escapeHtml(value||'')}"></div>`;if(meta.type==='select')return `<div class="field"><label for="${feedId}-${field}">${label}<small>${unit}</small></label><select id="${feedId}-${field}" data-field="${field}">${meta.values.map(option=>`<option value="${option}" ${String(value)===String(option)?'selected':''}>${field==='layout_mode'?(option==='split_columns'?'Side-by-side (default)':'Separate stop pages'):option+'%'}</option>`).join('')}</select></div>`;return `<div class="field"><label for="${feedId}-${field}">${label}<small>${unit}</small></label><input id="${feedId}-${field}" data-field="${field}" type="number" min="${meta.minimum}" max="${meta.maximum}" value="${value}" required></div>`;}
function selectedFor(feedId){return state.selected[feedId]||[];}
function ridesHtml(feedId,feed,schema){if(!schema.fields.rides)return '';const options=schema.available_rides||[];state.selected[feedId]=[...(feed.rides||[])];const selected=new Set(state.selected[feedId].map(x=>x.toLocaleLowerCase()));return `<div class="rides" data-rides-feed="${feedId}"><h3>Displayed rides</h3><p class="meta">Choose rides below. The ordered list controls display order; missing attractions are flagged by status rather than breaking the feed.</p><div class="ride-choices">${options.map(name=>`<label class="ride-choice"><input type="checkbox" data-ride="${escapeHtml(name)}" ${selected.has(name.toLocaleLowerCase())?'checked':''}><span>${escapeHtml(name)}</span></label>`).join('')||'<span class="meta">No live ride choices are currently available.</span>'}</div><ol class="selected-rides" data-selected-rides="${feedId}"></ol></div>`;}
const WINDOW_UNITS=[['minutes',1],['hours',60],['days',1440],['weeks',10080],['months',43200]];
function windowDurationParts(minutes){for(let i=WINDOW_UNITS.length-1;i>=0;i--){const [unit,factor]=WINDOW_UNITS[i];if(minutes%factor===0)return {amount:minutes/factor,unit};}return {amount:minutes,unit:'minutes'};}
function windowDurationControl(minutes){const {amount,unit}=windowDurationParts(minutes),factor=WINDOW_UNITS.find(([name])=>name===unit)[1],maximum=Math.floor(44640/factor);return '<input aria-label="Duration" data-window-duration type="number" min="1" max="'+maximum+'" step="1" value="'+amount+'"><select aria-label="Duration unit" data-window-unit>'+WINDOW_UNITS.map(([name])=>'<option value="'+name+'" '+(name===unit?'selected':'')+'>'+name+'</option>').join('')+'</select>';}
function scheduleWindowsHtml(feedId,windows=[]){return '<div class="schedule-windows" data-schedule-windows="'+feedId+'"><p class="meta">Cron starts use Europe/London time. Each start opens an eligibility window for its duration. Example: <code>0 18 * * 3</code> for 14 hours. Month means 30 days. No windows means always eligible.</p>'+(windows||[]).map(window=>'<div class="schedule-window"><input aria-label="Cron expression" data-window-cron value="'+escapeHtml(window.cron)+'" placeholder="0 18 * * 3">'+windowDurationControl(window.duration_minutes)+'<button class="icon-button" data-window-remove type="button" aria-label="Remove window">x</button></div>').join('')+'<button type="button" data-window-add>Add window</button></div>';}
function visibleAdvancedFields(feedId,schema){const fields=schema.advanced_fields||[];return feedId==='football_fixtures'?fields.filter(field=>!['portugal_enabled','england_enabled'].includes(field)):fields;}
function advancedHtml(feedId,feed,schema){const fields=visibleAdvancedFields(feedId,schema).filter(field=>schema.mutable_fields.includes(field));if(!fields.length)return '';return `<details class="feed-advanced"><summary>Advanced</summary><div class="feed-advanced-body">${fields.map(field=>fieldHtml(feedId,field,feed[field],schema)).join('')}</div></details>`;}

function collectFeedFields(feedId,root){const schema=state.config.schema.feeds[feedId],result={};for(const field of schema.mutable_fields){if(field==='schedule_windows'){const windowRoot=root.querySelector('[data-schedule-windows="'+feedId+'"]');result.schedule_windows=[...windowRoot.querySelectorAll('.schedule-window')].map(row=>{const cron=row.querySelector('[data-window-cron]').value.trim(),amount=Number(row.querySelector('[data-window-duration]').value),unit=row.querySelector('[data-window-unit]').value,factor=WINDOW_UNITS.find(([name])=>name===unit)?.[1],duration=amount*factor;if(!cron||!Number.isInteger(amount)||amount<1||!factor||!Number.isInteger(duration)||duration>44640)throw new Error(schema.label+': each window needs a whole duration from 1 minute to 31 days.');return {cron,duration_minutes:duration};});continue;}if(field==='rides'){result.rides=[...selectedFor(feedId)];continue;}const input=root.querySelector(`[data-field="${field}"]`);if(!input)continue;const meta=schema.fields[field]||{};if(meta.type==='boolean')result[field]=input.checked;else if(meta.type==='string'){const value=input.value.trim();if(meta.maximumLength&&value.length>meta.maximumLength)throw new Error(`${schema.label}: ${field.replaceAll('_',' ')} must be at most ${meta.maximumLength} characters.`);result[field]=value;}else if(meta.type==='select'){const value=meta.values.every(option=>typeof option==='number')?Number(input.value):input.value;if(!meta.values.includes(value))throw new Error(`${schema.label}: choose one of ${meta.values.join(', ')}.`);result[field]=value;}else{const value=Number(input.value);if(!Number.isInteger(value)||value<meta.minimum||value>meta.maximum)throw new Error(`${schema.label}: ${field.replaceAll('_',' ')} must be ${meta.minimum}–${meta.maximum}.`);result[field]=value;}}return result;}

function collectQueueCard(card){const patches=[];const groupSchema=state.config.schema.feeds.queue_times;const groupPatch={};for(const field of ['screen_duration_seconds',...(groupSchema.advanced_fields||[])]){if(field==='schedule_windows'){const root=card.querySelector('[data-schedule-windows="queue_times"]');groupPatch.schedule_windows=[...root.querySelectorAll('.schedule-window')].map(row=>{const cron=row.querySelector('[data-window-cron]').value.trim(),amount=Number(row.querySelector('[data-window-duration]').value),factor=WINDOW_UNITS.find(([name])=>name===row.querySelector('[data-window-unit]').value)?.[1],duration=amount*factor;if(!cron||!Number.isInteger(duration)||duration<1||duration>44640)throw new Error('Queue Times: each window needs cron text and a duration from 1 to 44640 minutes.');return {cron,duration_minutes:duration};});continue;}const input=card.querySelector(`.card-disclosure > .card-body [data-field="${field}"]`);if(!input)continue;const meta=groupSchema.fields[field]||{};if(meta.type==='boolean')groupPatch[field]=input.checked;else if(meta.type==='string')groupPatch[field]=input.value.trim();else{const value=Number(input.value);if(!Number.isInteger(value)||value<meta.minimum||value>meta.maximum)throw new Error(`Queue Times: ${field.replaceAll('_',' ')} must be ${meta.minimum}–${meta.maximum}.`);groupPatch[field]=value;}}patches.push(['queue_times',groupPatch]);for(const feedId of queueMemberIds()){const park=card.querySelector(`[data-park-feed="${feedId}"]`),schema=state.config.schema.feeds[feedId],patch={rides:[...selectedFor(feedId)]};for(const field of ['enabled','poll_seconds']){const input=park.querySelector(`[data-field="${field}"]`),meta=schema.fields[field]||{};if(meta.type==='boolean')patch[field]=input.checked;else{const value=Number(input.value);if(!Number.isInteger(value)||value<meta.minimum||value>meta.maximum)throw new Error(`${schema.label}: ${field.replaceAll('_',' ')} must be ${meta.minimum}–${meta.maximum}.`);patch[field]=value;}}patches.push([feedId,patch]);}return patches;}

function hasUnsavedChanges(){return Boolean(cards.querySelector('.card[data-dirty="true"]'));}
function captureDirtyDrafts(excludeFeedId){
 const drafts={};
 for(const card of cards.querySelectorAll('.card[data-dirty="true"]')){
  const feedId=card.dataset.feed;
  if(!feedId||feedId===excludeFeedId)continue;
  const memberIds=card.dataset.queueGroup==='true'?queueMemberIds():card.dataset.railGroup==='true'?['departures','steam_train']:[feedId];
  drafts[feedId]={
   fields:[...card.querySelectorAll('[data-field]')].map(input=>({feedId:input.closest('[data-rail-feed]')?.dataset.railFeed||input.closest('[data-park-feed]')?.dataset.parkFeed||feedId,field:input.dataset.field,value:input.type==='checkbox'?input.checked:input.value})),
   windows:[...card.querySelectorAll('[data-schedule-windows]')].map(root=>({feedId:root.dataset.scheduleWindows,rows:[...root.querySelectorAll('.schedule-window')].map(row=>({cron:row.querySelector('[data-window-cron]').value,amount:row.querySelector('[data-window-duration]').value,unit:row.querySelector('[data-window-unit]').value}))})),
   rides:Object.fromEntries(memberIds.map(id=>[id,[...selectedFor(id)]])),
   open:[...card.querySelectorAll('details')].map(details=>details.open)
  };
 }
 return drafts;
}
function restoreDirtyDrafts(drafts){
 for(const [feedId,draft] of Object.entries(drafts)){
  const card=[...cards.querySelectorAll('.card[data-feed]')].find(element=>element.dataset.feed===feedId);
  if(!card)continue;
  for(const entry of draft.fields||[]){
   const parent=card.querySelector('[data-rail-feed="'+CSS.escape(entry.feedId)+'"]')||card.querySelector('[data-park-feed="'+CSS.escape(entry.feedId)+'"]')||card;
   const input=parent?.querySelector('[data-field="'+CSS.escape(entry.field)+'"]');
   if(!input)continue;
   if(input.type==='checkbox')input.checked=Boolean(entry.value);else input.value=entry.value;
  }
  for(const entry of draft.windows||[]){
   const root=card.querySelector('[data-schedule-windows="'+CSS.escape(entry.feedId)+'"]');
   if(!root)continue;
   root.querySelectorAll('.schedule-window').forEach(row=>row.remove());
   const add=root.querySelector('[data-window-add]');
   for(const row of entry.rows){
    const element=document.createElement('div');element.className='schedule-window';
    element.innerHTML='<input aria-label="Cron expression" data-window-cron value="'+escapeHtml(row.cron)+'" placeholder="0 18 * * 3">'+windowDurationControl(60)+'<button class="icon-button" data-window-remove type="button" aria-label="Remove window">x</button>';
    element.querySelector('[data-window-duration]').value=row.amount;
    element.querySelector('[data-window-unit]').value=row.unit;
    root.insertBefore(element,add);
   }
  }
  for(const [id,rides] of Object.entries(draft.rides||{})){
   state.selected[id]=[...rides];
   const parent=id===feedId?card:card.querySelector('[data-park-feed="'+CSS.escape(id)+'"]');
   for(const input of parent?.querySelectorAll('[data-ride]')||[])input.checked=rides.some(name=>name.toLocaleLowerCase()===input.dataset.ride.toLocaleLowerCase());
   renderSelected(card,id);
  }
  [...card.querySelectorAll('details')].forEach((details,i)=>{if(i<draft.open.length)details.open=draft.open[i];});
  markDirty(card);
 }
}
async function patchFeed(feedId,body){const endpoint=feedId==='display'?'/display':`/feeds/${encodeURIComponent(feedId)}`;const {data}=await api(endpoint,{method:'PATCH',headers:{'Content-Type':'application/json','If-Match':`"${state.config.config_version}"`},body:JSON.stringify(body)});state.config=data;return data;}
async function saveCard(card){clearNotice();const feedId=card.dataset.feed,button=card.querySelector('[data-save]'),drafts=captureDirtyDrafts(feedId);try{const body=collect(card);button.disabled=true;button.textContent='Applying…';const data=await patchFeed(feedId,body);const label=feedId==='display'?data.schema.display.label:data.schema.feeds[feedId].label;const rebuildDelayed=data.rebuild_triggered===false;showNotice(rebuildDelayed?`${label} updated. The immediate screen rebuild could not be triggered; the scheduled publisher will apply it on its next run.`:`${label} updated. A screen rebuild has been triggered.`,rebuildDelayed?'warning':'success');const statusOk=await statusAfterSave();render();restoreDirtyDrafts(drafts);if(!statusOk)showNotice('Settings saved, but live status is unavailable. Refresh to retry.','warning');}catch(error){showNotice(error.message,'error');button.disabled=false;}finally{button.textContent='Apply changes';}}
async function saveRailCard(card){
 clearNotice();
 const button=card.querySelector('[data-save-rail]'),drafts=captureDirtyDrafts('departures');
 let applied=0;
 try{
  // Validate both feed patches before issuing the first If-Match write.
  const patches=collectRailCard(card);
  button.disabled=true;button.textContent='Applying…';
  let rebuildDelayed=false;
  for(const [feedId,body] of patches){
   const data=await patchFeed(feedId,body);
   applied++;
   rebuildDelayed=rebuildDelayed||data.rebuild_triggered===false;
  }
  showNotice(rebuildDelayed?'Rail Departures and Steam Train updated. The immediate screen rebuild was delayed; the scheduled publisher will apply your changes.':'Rail Departures and Steam Train updated. A screen rebuild has been triggered.',rebuildDelayed?'warning':'success');
  const statusOk=await statusAfterSave();
  render();restoreDirtyDrafts(drafts);
  if(!statusOk)showNotice('Rail settings saved, but live status is unavailable. Refresh to retry.','warning');
 }catch(error){
  // The two existing feed endpoints are not atomic. Preserve the form and its
  // unsaved marker if only the first PATCH succeeded, so retry is deliberate.
  showNotice((applied?'Some rail settings were saved before the error. ':'')+error.message,'error');
  markDirty(card);
  button.disabled=false;
 }finally{button.textContent='Apply rail changes';}
}
async function saveQueueCard(card){clearNotice();const button=card.querySelector('[data-save-queue]'),drafts=captureDirtyDrafts('queue_times');let applied=0;try{const patches=collectQueueCard(card);button.disabled=true;button.textContent='Applying…';let rebuildDelayed=false;for(const [feedId,body] of patches){const data=await patchFeed(feedId,body);applied+=1;rebuildDelayed=rebuildDelayed||data.rebuild_triggered===false;}showNotice(rebuildDelayed?'Queue Times updated. One or more immediate rebuild triggers were delayed; the scheduled publisher will apply the saved configuration.':'Queue Times and all park settings updated. A screen rebuild has been triggered.',rebuildDelayed?'warning':'success');const statusOk=await statusAfterSave();render();restoreDirtyDrafts(drafts);if(!statusOk)showNotice('Settings saved, but live status is unavailable. Refresh to retry.','warning');}catch(error){showNotice((applied?'Some queue settings were saved before the error. ':'')+error.message,'error');button.disabled=false;}finally{button.textContent='Apply queue changes';}}
function updateGlobalHealth(){const entries=Object.entries(state.status?.feeds||{}).filter(([feedId,feed])=>!state.config?.schema?.feeds?.[feedId]?.virtual&&feed.enabled);const states=entries.map(([,feed])=>feed.health);const current=!state.status?'unavailable':states.includes('unavailable')?'unavailable':states.includes('stale')?'stale':states.length?'ok':'disabled';health.innerHTML=`<span class="dot ${current}"></span><span>${current==='ok'?'All enabled feeds healthy':current}</span>`;}
async function runGarbageCollection(){if(!window.confirm('Run garbage collection now? This sends a maintenance request to the publisher.'))return;clearNotice();const button=document.getElementById('gc-action');button.disabled=true;button.textContent='Requesting…';try{const result=await api('/maintenance/gc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:true})});showNotice(result.data.message||'Garbage collection requested.','success');}catch(error){showNotice(error.message,'error');}finally{button.disabled=false;button.textContent='Run garbage collection';}}
async function loadStatus(){const result=await api('/status');state.status=result.data;return result.data;}
async function statusAfterSave(){try{await loadStatus();return true;}catch(error){state.status=null;return false;}}
async function load(){cards.setAttribute('aria-busy','true');clearNotice();try{const [configResult,statusResult]=await Promise.allSettled([api('/config'),api('/status')]);if(configResult.status==='rejected')throw configResult.reason;state.config=configResult.value.data;state.status=statusResult.status==='fulfilled'?statusResult.value.data:null;state.selected={};render();if(statusResult.status==='rejected')showNotice('Configuration loaded, but live status is unavailable: '+statusResult.reason.message,'warning');}catch(error){state.config=null;state.status=null;state.selected={};navItems=[];cards.replaceChildren();document.getElementById('section-navigation').replaceChildren();document.getElementById('section-title').textContent='Configuration unavailable';document.getElementById('section-subtitle').textContent='Refresh to retry loading the control plane.';document.getElementById('breadcrumb').textContent='Administration';showNotice(error.message,'error');health.innerHTML='<span class="dot unavailable"></span><span>Unavailable</span>';diagnostics.textContent=error.message;}finally{cards.setAttribute('aria-busy','false');}}

/* Navigation is derived from live config; changing views moves (not recreates) form nodes. */
let navItems=[],navOpen=false;
const navPanel=document.getElementById('nav-panel'),navToggle=document.getElementById('nav-toggle');
const navScrim=document.getElementById('nav-scrim'),navSearch=document.getElementById('nav-search');
const narrowViewport=window.matchMedia('(max-width: 840px)');
function navigationModel(config){
 const feeds=config.feeds||{},schemas=config.schema?.feeds||{},available=id=>Object.hasOwn(feeds,id)&&Object.hasOwn(schemas,id);
 const mapped=new Set(),groups=[];
 const push=(group,label,items)=>{if(items.length)groups.push({group,label,items});};
 const item=(id,label,view=id,feedIds=(id==='overview'||id==='maintenance'?[]:[id]))=>({key:id==='overview'||id==='maintenance'?id:'screen/'+id,label,view,feedIds});
 const known=(ids)=>ids.filter(available);
 const rail=known(['departures','steam_train']);rail.forEach(id=>mapped.add(id));
 const transport=[];
 if(rail.length)transport.push(item(rail.includes('departures')?'departures':'steam_train','Rail Departures & Steam Train','rail',rail));
 if(available('sl7_bus')){mapped.add('sl7_bus');transport.push(item('sl7_bus','SL7 Bus'));}
 push('transport','Transport',transport);
 const weather=[];
 if(available('weather')){mapped.add('weather');weather.push(item('weather','Weather · 7-day overview'));weather.push(item('weather-next-24-hours','Weather · Next 24 hours','weather',['weather']));weather.push(item('weather-sunrise-sunset','Weather · Sunrise / sunset','weather',['weather']));}if(available('today')){mapped.add('today');weather.push(item('today','Today · current conditions'));}
 push('weather','Weather',weather);
 const queue=Object.keys(schemas).filter(id=>schemas[id]?.provider==='queue_times'&&available(id));
 const parks=[];
 if(available('queue_times')){
  mapped.add('queue_times');
  parks.push(item('queue_times','Queue Times · all parks','queue_times',['queue_times',...queue]));
  for(const id of queue){mapped.add(id);parks.push(item(id,schemas[id].label||id,'queue_times',['queue_times',...queue]));}
 }else for(const id of queue){mapped.add(id);parks.push(item(id,schemas[id].label||id));}
 push('parks','Theme parks',parks);
 const calendar=[];
 for(const [id,label] of [['calendar','Todoist / calendar'],['todoist','Todoist'],['cubs','Scouts · Beavers & Cubs'],['christmas','Christmas tracker'],['christmas_tracker','Christmas tracker'],['football_fixtures','Football']])if(available(id)){mapped.add(id);calendar.push(item(id,label));}
 push('calendar','Calendar & events',calendar);
 const fun=[];
 for(const [id,label] of [['dad_joke','Dad Joke'],['insult_of_hour','Insult of the Hour'],['random_fact','Random Fact'],['quotes','Quotes']])if(available(id)){mapped.add(id);fun.push(item(id,label));}
 push('fun','Fun & content',fun);
 const mqtt=[];
 for(const [id,label] of [['flash','Flash & reminders'],['recycling','Recycling']])if(available(id)){mapped.add(id);mqtt.push(item(id,label));}
 push('mqtt','MQTT & notifications',mqtt);
 const other=Object.keys(feeds).filter(id=>available(id)&&!mapped.has(id)).map(id=>item(id,schemas[id].label||id));
 push('other','Other screens',other);
 groups.unshift({group:'overview',label:'Overview',items:[item('overview','Overview')]});
 groups.splice(1,0,{group:'preview',label:'Board preview',items:[item('live-preview','Live screen preview','live_preview',[])]});
 groups.push({group:'maintenance',label:'Maintenance & diagnostics',items:[item('maintenance','Maintenance & diagnostics')]});
 return groups;
}
function navigationHealth(entry){
 if(!entry.feedIds.length)return '';
 if(entry.view==='queue_times')return queueHealth();
 const status=state.status?.feeds?.[entry.feedIds[0]];
 return status?.enabled===false?'disabled':status?.health||'unavailable';
}
function overviewHtml(){
 const entries=Object.entries(state.status?.feeds||{}).filter(([id,feed])=>state.config?.schema?.feeds?.[id]&&!state.config.schema.feeds[id].virtual&&feed.enabled);
 const unhealthy=entries.filter(([,feed])=>feed.health!=='ok');
 const attention=unhealthy.length?'<ul class="attention-list" aria-label="Enabled feeds needing attention">'+unhealthy.map(([feedId,feed])=>{
  const schema=state.config?.schema?.feeds?.[feedId]||{};
  const destination=navItems.find(entry=>entry.key==='screen/'+feedId)||navItems.find(entry=>entry.feedIds.includes(feedId));
  const label=schema.label||feedId.replaceAll('_',' ');
  const health=feed.health||'unknown';
  const name=destination?'<a href="#'+escapeHtml(destination.key)+'">'+escapeHtml(label)+'</a>':escapeHtml(label);
  return '<li class="attention-item">'+name+'<span class="attention-state '+(health==='unavailable'?'unavailable':'')+'">'+escapeHtml(health)+'</span></li>';
 }).join('')+'</ul>':'<p class="meta">'+(state.status?'All enabled feeds are healthy.':'Feed status could not be loaded.')+'</p>';
 const config=state.config;
 const published=state.status?.published_at||state.status?.last_publish_at||state.status?.last_published_at;
 return '<div class="overview-grid"><div class="overview-panel"><h3>Enabled feeds</h3><strong>'+entries.length+'</strong><p class="meta">'+(state.status?'From current API status':'Status unavailable; configuration remains editable')+'</p></div>'+
  '<div class="overview-panel"><h3>Feeds needing attention</h3><strong>'+(state.status?unhealthy.length:'Unknown')+'</strong>'+attention+'</div>'+
  '<div class="overview-panel"><h3>Configuration version</h3><strong>'+escapeHtml(config?.config_version||'Unknown')+'</strong><p class="meta">Updated '+escapeHtml(formatTime(config?.updated_at))+'</p></div>'+
  '<div class="overview-panel"><h3>Published</h3><strong>'+escapeHtml(formatTime(published))+'</strong><p class="meta">As reported by the control API</p></div></div>'+
  '<div class="overview-panel" style="grid-column:1/-1"><h3>Quick access</h3><p>Choose a screen from the navigation or open a common section:</p><div class="overview-links">'+navItems.filter(entry=>['screen/live-preview','screen/departures','screen/weather','screen/queue_times','maintenance'].includes(entry.key)).map(entry=>'<a href="#'+escapeHtml(entry.key)+'">'+escapeHtml(entry.label)+'</a>').join('')+'</div></div>';
}
function organiseNavigation(){
 const groups=navigationModel(state.config);navItems=groups.flatMap(group=>group.items.map(entry=>({...entry,group:group.label})));
 const nodes=new Map([...cards.querySelectorAll('.card[data-feed]')].map(card=>[card.dataset.feed,card]));
 const rail=cards.querySelector('.rail-card, .feed-section, .card[data-feed="departures"], .card[data-feed="steam_train"]'),staticFeeds=cards.querySelector('.static-feeds');
 const maintenance=staticFeeds?.querySelector('.card:not([data-feed])');
 const quotesCredit=[...(staticFeeds?.querySelectorAll('p')||[])].find(p=>p.textContent.includes('Inspirational quotes provided by'));
 const views=[],seen=new Set();
 for(const entry of navItems){
  if(seen.has(entry.view))continue;seen.add(entry.view);
  const section=document.createElement('section');section.className='nav-view';section.dataset.navView=entry.view;section.hidden=true;
  if(entry.view==='overview')section.innerHTML=overviewHtml();
  else if(entry.view==='live_preview')section.innerHTML='<div class="overview-panel screen-preview-panel"><h3>Live screen preview</h3><p>The simulator reads the same <code>/api/screens</code> feed as the MatrixPortal and cycles through its screen content. Use Previous and Next to inspect each screen, or Pause to hold one in place.</p><iframe id="live-screen-preview" class="screen-preview-frame" data-src="/?admin-preview=1" src="about:blank" title="Live preview of MatrixPortal screens"></iframe><p class="meta">The preview refreshes from the API every 30 seconds. Firmware-only animations are included where the simulator mirrors them; MQTT messages that the board receives separately are not part of the HTTP screen payload.</p></div>';
  else if(entry.view==='maintenance'){
   if(maintenance)section.appendChild(maintenance);
   const hint=document.createElement('p');hint.className='meta';hint.textContent='Diagnostics are below. These tools do not edit individual screen settings.';section.appendChild(hint);
  }else if(entry.view==='rail'&&rail)section.appendChild(rail);
  else{
   const card=nodes.get(entry.view);
   if(card)section.appendChild(card);
   if(entry.view==='quotes'&&quotesCredit)section.appendChild(quotesCredit);
   if(entry.view==='random_fact'){
    const hint=document.createElement('p');hint.className='meta';hint.innerHTML='Insult of the Hour is configured under Joke and Fun: <a href="#insult-of-hour">open its controls</a>.';section.appendChild(hint);
   }
  }
  views.push(section);
 }
 cards.replaceChildren(...views);
 const navigation=document.getElementById('section-navigation');
 navigation.innerHTML=groups.map(group=>'<details class="nav-group" data-nav-group="'+escapeHtml(group.group)+'" open><summary>'+escapeHtml(group.label)+'</summary><div class="nav-group-links">'+group.items.map(entry=>{
  const healthState=navigationHealth(entry);
  return '<a class="nav-link" href="#'+escapeHtml(entry.key)+'" data-nav-key="'+escapeHtml(entry.key)+'"><span class="nav-link-text">'+escapeHtml(entry.label)+'</span>'+(healthState?'<span class="nav-health '+escapeHtml(healthState)+'" title="'+escapeHtml(healthState)+'" aria-label="'+escapeHtml(healthState)+'"></span>':'')+'<span class="nav-dirty" hidden title="Unsaved changes" aria-label="Unsaved changes">●</span></a>';
 }).join('')+'</div></details>').join('');
 filterNavigation();updateDirtyNavigation();selectFromHash(false);
}
function updateDirtyNavigation(){
 for(const link of document.querySelectorAll('[data-nav-key]')){
  const item=navItems.find(entry=>entry.key===link.dataset.navKey);
  if(!item)continue;
  const dirty=item.feedIds.some(id=>{
   const card=[...cards.querySelectorAll('.card[data-dirty="true"]')].find(card=>card.dataset.feed===id);
   return Boolean(card)||item.view==='queue_times'&&Boolean(cards.querySelector('.queue-card[data-dirty="true"]'));
  });
  const indicator=link.querySelector('.nav-dirty');
  if(indicator)indicator.hidden=!dirty;
 }
}
function selectedKeyFromHash(){
 let hash='';
 try{hash=decodeURIComponent(window.location.hash.slice(1));}catch(e){return 'overview';}
 if(hash==='insult-of-hour')return 'screen/insult_of_hour';
 if(hash==='screen/steam_train'&&navItems.some(item=>item.key==='screen/departures'))return 'screen/departures';
 return navItems.some(item=>item.key===hash)?hash:'overview';
}
function selectFromHash(focusHeading){
 const key=selectedKeyFromHash();
 const item=navItems.find(entry=>entry.key===key)||navItems[0];
 if(!item)return;
 for(const view of cards.querySelectorAll('[data-nav-view]'))view.hidden=view.dataset.navView!==item.view;
 const currentView=[...cards.querySelectorAll('[data-nav-view]')].find(view=>view.dataset.navView===item.view);
 const previewFrame=document.getElementById('live-screen-preview');
 if(previewFrame){
  const previewActive=previewFrame.getAttribute('src')!=='about:blank';
  if(item.view==='live_preview'&&!previewActive)previewFrame.setAttribute('src',previewFrame.dataset.src);
  else if(item.view!=='live_preview'&&previewActive)previewFrame.setAttribute('src','about:blank');
 }
 if(currentView)for(const details of currentView.querySelectorAll('.card-disclosure'))details.open=true;
 if(item.view==='weather'&&key==='screen/weather-next-24-hours'){const detail=currentView?.querySelectorAll('.queue-park')[1];if(detail)detail.open=true;}
 if(item.view==='weather'&&key==='screen/weather-sunrise-sunset'){const detail=currentView?.querySelectorAll('.queue-park')[2];if(detail)detail.open=true;}
 for(const link of document.querySelectorAll('[data-nav-key]')){
  if(link.dataset.navKey===key)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
 }
 document.getElementById('breadcrumb').textContent=item.group+' / '+item.label;
 const heading=document.getElementById('section-title');heading.textContent=item.label;
 document.getElementById('section-subtitle').textContent=item.view==='rail'?'One panel and Apply action for the departures board and its Steam Train introduction.':item.view==='queue_times'?'Park selection and ordering save together.':'';
 document.getElementById('maintenance-diagnostics').hidden=item.view!=='maintenance';
 if(item.view==='queue_times'&&key!=='screen/queue_times'){
  const park=cards.querySelector('[data-park-feed="'+CSS.escape(key.slice(7))+'"]');
  if(park)park.open=true;
 }
 if(focusHeading)heading.focus({preventScroll:true});
 closeNavigation(false);
}
function filterNavigation(){
 const query=navSearch.value.trim().toLocaleLowerCase();let matches=0;
 for(const group of document.querySelectorAll('.nav-group')){
  let count=0;
  for(const link of group.querySelectorAll('.nav-link')){
   const matchesQuery=link.textContent.toLocaleLowerCase().includes(query)||link.dataset.navKey.toLocaleLowerCase().includes(query)||group.querySelector('summary').textContent.toLocaleLowerCase().includes(query);
   link.hidden=!matchesQuery;if(matchesQuery){count++;matches++;}
  }
  group.hidden=count===0;
  if(query&&count)group.open=true;
 }
 document.getElementById('nav-empty').hidden=matches!==0;
}
function closeNavigation(returnFocus){
 if(!navOpen)return;
 navOpen=false;navPanel.classList.remove('is-open');navScrim.hidden=true;
 navToggle.setAttribute('aria-expanded','false');document.documentElement.classList.remove('nav-drawer-open');
 if(narrowViewport.matches)navPanel.inert=true;
 if(returnFocus)navToggle.focus();
}
function openNavigation(){
 navOpen=true;navPanel.inert=false;navPanel.classList.add('is-open');navScrim.hidden=false;
 navToggle.setAttribute('aria-expanded','true');document.documentElement.classList.add('nav-drawer-open');navSearch.focus();
}
function syncNavigationViewport(){
 if(!narrowViewport.matches){closeNavigation(false);navPanel.inert=false;}
 else if(!navOpen)navPanel.inert=true;
}
navToggle.addEventListener('click',()=>navOpen?closeNavigation(true):openNavigation());
navScrim.addEventListener('click',()=>closeNavigation(true));
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&navOpen){event.preventDefault();closeNavigation(true);}});
document.getElementById('section-navigation').addEventListener('click',event=>{
 const link=event.target.closest('a[data-nav-key]');if(!link)return;
 event.preventDefault();const hash='#'+link.dataset.navKey;
 if(window.location.hash===hash)selectFromHash(true);else window.location.hash=hash;
 closeNavigation(false);
});
navSearch.addEventListener('input',filterNavigation);
window.addEventListener('hashchange',()=>selectFromHash(true));
narrowViewport.addEventListener('change',syncNavigationViewport);
syncNavigationViewport();
window.addEventListener('beforeunload',event=>{if(hasUnsavedChanges()){event.preventDefault();event.returnValue='';}});
function refreshWithWarning(){
 if(hasUnsavedChanges()&&!window.confirm('Discard unsaved screen changes and refresh configuration?'))return;
 load();
}

const accessReady=new URLSearchParams(window.location.search).get('access')==='1';
if(!accessReady){
  // Cloudflare's session redirect cannot carry a URL fragment; keep the bookmark locally.
  if(window.location.hash)window.sessionStorage.setItem('led-admin-return-hash',window.location.hash);
  window.location.replace(`${API}/session`);
}else{
  const savedHash=window.sessionStorage.getItem('led-admin-return-hash');
  window.sessionStorage.removeItem('led-admin-return-hash');
  const restoredHash=window.location.hash||(savedHash&&savedHash.startsWith('#')?savedHash:'');
  window.history.replaceState(null,'','/admin'+restoredHash);
  document.getElementById('refresh').addEventListener('click',refreshWithWarning);
  document.addEventListener('click',event=>{if(event.target.id==='gc-action')runGarbageCollection();});
  load();
}
</script>
</main></body></html>
