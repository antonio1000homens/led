<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>LED control plane</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d13;color:#edf3f8;--panel:#111821;--panel2:#151f2b;--line:#2a394a;--muted:#91a0b2;--accent:#74c7ff;--ok:#74df93;--warn:#f3c969;--bad:#ff8176}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#12243a 0,#090d13 42%);color:#edf3f8}main{max-width:1180px;margin:auto;padding:28px 18px 56px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font-size:clamp(1.8rem,4vw,3rem);margin:.18em 0 .2em}p{color:var(--muted);line-height:1.5;margin:.35rem 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:#0e151e;color:var(--muted);font-size:.84rem}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.stale{background:var(--warn)}.dot.unavailable{background:var(--bad)}.dot.disabled{background:#667485}button{font:inherit;color:inherit;border:1px solid var(--line);background:#172231;border-radius:9px;padding:9px 13px;cursor:pointer}button:hover:not(:disabled){border-color:#42617d;background:#1b2a3b}button.primary{border-color:#2d789f;background:#12547a}button.primary:hover:not(:disabled){background:#16668f}button:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;padding:12px 14px;border-radius:9px;margin:14px 0;border:1px solid var(--line);background:#111923}.notice.show{display:block}.notice.error{border-color:#713b3b;color:#ffc0bb}.notice.success{border-color:#2d6442;color:#a8efb9}.notice.warning{border-color:#735f2d;color:#f8d98a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.18)}.card-head{display:flex;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.card h2{font-size:1.08rem;margin:0 0 4px}.provider{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.card-body{padding:18px}.field{display:grid;grid-template-columns:minmax(0,1fr) 122px;gap:12px;align-items:center;margin:12px 0}.field label{font-size:.92rem}.field small{display:block;color:var(--muted);font-size:.74rem;margin-top:3px}.switch{justify-self:end;position:relative;width:48px;height:27px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:999px;background:#344151;transition:.16s}.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:white;border-radius:50%;transition:.16s}.switch input:checked+.slider{background:#1978aa}.switch input:checked+.slider:before{transform:translateX(21px)}input[type=number]{width:100%;background:#0b1119;border:1px solid #34475b;border-radius:8px;padding:8px 9px;color:inherit;font:inherit}input:focus,button:focus,summary:focus{outline:2px solid var(--accent);outline-offset:2px}.rides{margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.rides h3{font-size:.9rem;margin:0 0 9px}.ride-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:210px;overflow:auto;padding:2px}.ride-choice{display:flex;gap:7px;align-items:flex-start;font-size:.82rem;color:#d8e0e8}.selected-rides{margin:12px 0 0;padding:0;list-style:none}.selected-rides li{display:flex;align-items:center;gap:7px;padding:7px 8px;border:1px solid #26394c;border-radius:8px;margin-top:6px;background:#0d151e;font-size:.82rem}.selected-rides .name{flex:1}.icon-button{padding:3px 7px;border-radius:6px;font-size:.72rem}.feed-advanced{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.feed-advanced summary{cursor:pointer;font-size:.9rem;font-weight:600;color:#c7d4df}.feed-advanced-body{padding-top:6px}.card-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding:13px 18px;background:#0e151e}.dirty{font-size:.78rem;color:var(--warn);visibility:hidden}.card[data-dirty=true] .dirty{visibility:visible}.meta{font-size:.78rem;color:var(--muted);line-height:1.6}.advanced{margin-top:22px;border:1px solid var(--line);border-radius:12px;background:#0d141c;padding:12px 14px}summary{cursor:pointer;color:#c7d4df}pre{overflow:auto;font-size:.75rem;color:#9fb0c2;white-space:pre-wrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:620px){main{padding:20px 12px 40px}.topbar{display:block}.toolbar{margin-top:14px}.grid{grid-template-columns:1fr}.ride-choices{grid-template-columns:1fr}.field{grid-template-columns:minmax(0,1fr) 108px}}
</style>
</head>
<body><main>
<header class="topbar"><div><div class="eyebrow">Runtime control plane</div><h1>LED administration</h1><p>Operational settings apply without a deployment. Authentication is provided by Cloudflare Access.</p></div><div class="toolbar"><span class="badge" id="global-health"><span class="dot"></span><span>Loading</span></span><button id="refresh" type="button">Refresh</button></div></header>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<section id="cards" class="grid" aria-busy="true"></section>
<details class="advanced"><summary>Advanced diagnostics</summary><pre id="diagnostics">Loading…</pre></details>
<script>
const API='/api/control/v1';
const cards=document.getElementById('cards'),notice=document.getElementById('notice'),diagnostics=document.getElementById('diagnostics'),health=document.getElementById('global-health');
let state={config:null,status:null,selected:{}};
function showNotice(message,kind=''){notice.textContent=message;notice.className='notice show '+kind;}
function clearNotice(){notice.className='notice';notice.textContent='';}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
async function api(path,options={}){const response=await fetch(API+path,{cache:'no-store',credentials:'same-origin',...options,headers:{'Accept':'application/json',...(options.headers||{})}});let data={};try{data=await response.json()}catch(e){}if(!response.ok){if(response.status===401)throw new Error('Cloudflare Access authentication is required or has expired.');if(response.status===412)throw new Error('Configuration changed elsewhere. Refresh before saving.');throw new Error(data.error||`Request failed (${response.status})`);}return {data,etag:response.headers.get('etag')};}
function formatTime(value){if(!value)return 'Never';const date=new Date(value);return Number.isNaN(date.valueOf())?value:date.toLocaleString();}
function fieldHtml(feedId,field,value,schema){const meta=schema.fields[field]||{};if(field==='enabled')return `<div class="field"><label id="${feedId}-enabled-label">Enabled<small>Stops polling and removes output when off</small></label><label class="switch"><input data-field="enabled" type="checkbox" ${value?'checked':''} aria-labelledby="${feedId}-enabled-label"><span class="slider"></span></label></div>`;const labels={poll_seconds:['Polling interval','seconds between provider refreshes'],screen_duration_seconds:['Screen duration','seconds on screen'],station_scroll_speed:['Station scroll speed','pixels per second'],station_list_spacing:['Station spacing','pixels between individual stations'],upcoming_train_count:['Upcoming trains','number of trains to cycle'],upcoming_train_pause_seconds:['Train cycle pause','seconds to hold before the next train']};const [label,unit]=labels[field]||[field.replaceAll('_',' '),''];return `<div class="field"><label for="${feedId}-${field}">${label}<small>${unit}</small></label><input id="${feedId}-${field}" data-field="${field}" type="number" min="${meta.minimum}" max="${meta.maximum}" value="${value}" required></div>`;}
function selectedFor(feedId){return state.selected[feedId]||[];}
function ridesHtml(feedId,feed,schema){if(!schema.fields.rides)return '';const options=schema.available_rides||[];state.selected[feedId]=[...(feed.rides||[])];const selected=new Set(state.selected[feedId].map(x=>x.toLocaleLowerCase()));return `<div class="rides"><h3>Displayed rides</h3><p class="meta">Choose rides below. The ordered list controls display order; missing attractions are flagged by status rather than breaking the feed.</p><div class="ride-choices">${options.map((name,i)=>`<label class="ride-choice"><input type="checkbox" data-ride="${escapeHtml(name)}" ${selected.has(name.toLocaleLowerCase())?'checked':''}><span>${escapeHtml(name)}</span></label>`).join('')||'<span class="meta">No live ride choices are currently available.</span>'}</div><ol class="selected-rides" data-selected-rides></ol></div>`;}
function advancedHtml(feedId,feed,schema){const fields=(schema.advanced_fields||[]).filter(field=>schema.mutable_fields.includes(field));if(!fields.length)return '';return `<details class="feed-advanced"><summary>Advanced</summary><div class="feed-advanced-body">${fields.map(field=>fieldHtml(feedId,field,feed[field],schema)).join('')}</div></details>`;}
function renderSelected(card,feedId){const list=card.querySelector('[data-selected-rides]');if(!list)return;const values=selectedFor(feedId);list.innerHTML=values.map((name,index)=>`<li><span class="name">${index+1}. ${escapeHtml(name)}</span><button class="icon-button" data-move="up" data-index="${index}" type="button" aria-label="Move ${escapeHtml(name)} up" ${index===0?'disabled':''}>↑</button><button class="icon-button" data-move="down" data-index="${index}" type="button" aria-label="Move ${escapeHtml(name)} down" ${index===values.length-1?'disabled':''}>↓</button></li>`).join('');}
function cardHtml(feedId,feed,schema,status){const advanced=new Set(schema.advanced_fields||[]);const fields=schema.mutable_fields.filter(field=>field!=='rides'&&!advanced.has(field));const healthState=status?.health||'unavailable';return `<article class="card" data-feed="${feedId}" data-dirty="false"><div class="card-head"><div><h2>${escapeHtml(schema.label)}</h2><div class="provider">${escapeHtml(schema.provider)}</div></div><span class="badge"><span class="dot ${healthState}"></span>${escapeHtml(healthState)}</span></div><div class="card-body">${fields.map(field=>fieldHtml(feedId,field,feed[field],schema)).join('')}${advancedHtml(feedId,feed,schema)}${ridesHtml(feedId,feed,schema)}<div class="meta" style="margin-top:14px">Last success: ${escapeHtml(formatTime(status?.last_successful_refresh))}<br>Last attempt: ${escapeHtml(formatTime(status?.last_attempted_refresh))}</div></div><div class="card-foot"><span class="dirty">Unsaved changes</span><button class="primary" data-save type="button" disabled>Apply changes</button></div></article>`;}
function render(){const config=state.config,status=state.status;if(!config)return;cards.innerHTML=Object.entries(config.feeds).map(([feedId,feed])=>cardHtml(feedId,feed,config.schema.feeds[feedId],status?.feeds?.[feedId])).join('');cards.setAttribute('aria-busy','false');for(const card of cards.querySelectorAll('.card')){const feedId=card.dataset.feed;renderSelected(card,feedId);card.addEventListener('input',event=>{if(event.target.matches('[data-ride]')){const name=event.target.dataset.ride;const values=selectedFor(feedId);const existing=values.findIndex(v=>v.toLocaleLowerCase()===name.toLocaleLowerCase());if(event.target.checked&&existing<0)values.push(name);if(!event.target.checked&&existing>=0)values.splice(existing,1);renderSelected(card,feedId);}markDirty(card);});card.addEventListener('click',event=>{const move=event.target.closest('[data-move]');if(move){const index=Number(move.dataset.index),values=selectedFor(feedId),next=move.dataset.move==='up'?index-1:index+1;if(next>=0&&next<values.length){[values[index],values[next]]=[values[next],values[index]];renderSelected(card,feedId);markDirty(card);}return;}if(event.target.closest('[data-save]'))saveCard(card);});}
updateGlobalHealth();diagnostics.textContent=JSON.stringify({config_version:config.config_version,updated_at:config.updated_at,updated_by:config.updated_by,status},null,2);}
function markDirty(card){card.dataset.dirty='true';card.querySelector('[data-save]').disabled=false;}
function collect(card){const feedId=card.dataset.feed,schema=state.config.schema.feeds[feedId],result={};for(const field of schema.mutable_fields){if(field==='rides'){result.rides=[...selectedFor(feedId)];continue;}const input=card.querySelector(`[data-field="${field}"]`);if(field==='enabled')result[field]=input.checked;else{const value=Number(input.value);const meta=schema.fields[field];if(!Number.isInteger(value)||value<meta.minimum||value>meta.maximum)throw new Error(`${schema.label}: ${field.replaceAll('_',' ')} must be ${meta.minimum}–${meta.maximum}.`);result[field]=value;}}return result;}
function captureDirtyDrafts(excludeFeedId){const drafts={};for(const card of cards.querySelectorAll('.card[data-dirty="true"]')){const feedId=card.dataset.feed;if(feedId===excludeFeedId)continue;const fields={};for(const input of card.querySelectorAll('[data-field]'))fields[input.dataset.field]=input.type==='checkbox'?input.checked:input.value;drafts[feedId]={fields,rides:[...selectedFor(feedId)]};}return drafts;}
function restoreDirtyDrafts(drafts){for(const [feedId,draft] of Object.entries(drafts)){const card=cards.querySelector(`.card[data-feed="${feedId}"]`);if(!card)continue;for(const [field,value] of Object.entries(draft.fields||{})){const input=card.querySelector(`[data-field="${field}"]`);if(!input)continue;if(input.type==='checkbox')input.checked=Boolean(value);else input.value=value;}if(Array.isArray(draft.rides)){state.selected[feedId]=[...draft.rides];for(const input of card.querySelectorAll('[data-ride]'))input.checked=draft.rides.some(name=>name.toLocaleLowerCase()===input.dataset.ride.toLocaleLowerCase());renderSelected(card,feedId);}markDirty(card);}}
async function saveCard(card){clearNotice();const feedId=card.dataset.feed,button=card.querySelector('[data-save]'),drafts=captureDirtyDrafts(feedId);try{const body=collect(card);button.disabled=true;button.textContent='Applying…';const {data}=await api(`/feeds/${encodeURIComponent(feedId)}`,{method:'PATCH',headers:{'Content-Type':'application/json','If-Match':`"${state.config.config_version}"`},body:JSON.stringify(body)});state.config=data;const rebuildDelayed=data.rebuild_triggered===false;showNotice(rebuildDelayed?`${data.schema.feeds[feedId].label} updated. The immediate screen rebuild could not be triggered; the scheduled publisher will apply it on its next run.`:`${data.schema.feeds[feedId].label} updated. A screen rebuild has been triggered.`,rebuildDelayed?'warning':'success');await loadStatus();render();restoreDirtyDrafts(drafts);}catch(error){showNotice(error.message,'error');button.disabled=false;}finally{button.textContent='Apply changes';}}
function updateGlobalHealth(){const feeds=Object.values(state.status?.feeds||{}).filter(feed=>feed.enabled);const states=feeds.map(feed=>feed.health);const current=states.includes('unavailable')?'unavailable':states.includes('stale')?'stale':states.length?'ok':'disabled';health.innerHTML=`<span class="dot ${current}"></span><span>${current==='ok'?'All enabled feeds healthy':current}</span>`;}
async function loadStatus(){const result=await api('/status');state.status=result.data;return result.data;}
async function load(){cards.setAttribute('aria-busy','true');clearNotice();try{const [configResult,statusResult]=await Promise.all([api('/config'),api('/status')]);state.config=configResult.data;state.status=statusResult.data;state.selected={};render();}catch(error){cards.innerHTML='';showNotice(error.message,'error');health.innerHTML='<span class="dot unavailable"></span><span>Unavailable</span>';diagnostics.textContent=error.message;}}
const accessReady=new URLSearchParams(window.location.search).get('access')==='1';
if(!accessReady){
  window.location.replace(`${API}/session`);
}else{
  window.history.replaceState(null,'','/admin');
  document.getElementById('refresh').addEventListener('click',load);
  load();
}
</script>
</main></body></html>
