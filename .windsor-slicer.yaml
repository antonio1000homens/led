version: 2

models:
  panel-hinge-template:
    source: hardware/enclosure/parts/01_panel_hinge_template_PRINT_1.scad
    generator: openscad
    output: 01_panel_hinge_template_PRINT_1.stl

  modular-hinge-base:
    source: hardware/enclosure/parts/02_hinged_equipment_base_PRINT_1.scad
    generator: openscad
    output: 02_hinged_equipment_base_PRINT_1.stl

  universal-equipment-backplane:
    source: hardware/enclosure/parts/03_universal_equipment_backplane_PRINT_1.scad
    generator: openscad
    output: 03_universal_equipment_backplane_PRINT_1.stl
    variants:
      support-free-check:
        support_mode: "off"
      petg-supported:
        machine_profile: "Bambu Lab H2D 0.4 nozzle"
        process_profile: "0.20mm Standard @BBL H2D"
        filament_profile: "Bambu PETG Basic @BBL H2D 0.4 nozzle"
        bed_type: "Textured PEI Plate"
        support_mode: "tree-auto"

  left-equipment-side:
    source: hardware/enclosure/parts/04_left_equipment_side_PRINT_1.scad
    generator: openscad
    output: 04_left_equipment_side_PRINT_1.stl

  right-equipment-side:
    source: hardware/enclosure/parts/05_right_equipment_side_PRINT_1.scad
    generator: openscad
    output: 05_right_equipment_side_PRINT_1.stl

  matrixportal-s3-dock:
    source: hardware/enclosure/parts/08_matrixportal_s3_dock_PRINT_1.scad
    generator: openscad
    output: 08_matrixportal_s3_dock_PRINT_1.stl

  matrixportal-s3-carrier:
    source: hardware/enclosure/parts/10_matrixportal_s3_carrier_PRINT_1.scad
    generator: openscad
    output: 10_matrixportal_s3_carrier_PRINT_1.stl

  matrixportal-left-equipment-side:
    source: hardware/enclosure/parts/09_left_equipment_side_matrixportal_PRINT_1.scad
    generator: openscad
    output: 09_left_equipment_side_matrixportal_PRINT_1.stl


  psu-service-tray-dock:
    source: hardware/enclosure/powersupply/02_service_tray_snap_dock_PRINT_1.scad
    generator: openscad
    output: psu_service_tray_snap_dock.stl

  psu-service-tray-tray:
    source: hardware/enclosure/powersupply/03_service_tray_snap_tray_PRINT_1.scad
    generator: openscad
    output: psu_service_tray_snap_tray.stl
