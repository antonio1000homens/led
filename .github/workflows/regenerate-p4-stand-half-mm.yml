name: Enclosure / Regenerate stand for boss correction

on:
  push:
    branches:
      - fix/p4-boss-outward-half-mm
    paths:
      - '.github/workflows/regenerate-p4-stand-half-mm.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/p4-boss-outward-half-mm

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate stand
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount/09_centre_boss_desk_stand_PRINT_3.stl
          openscad -D 'part="centre_boss_stand"' -o "$out" "$src"

      - name: Commit regenerated stand
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/09_centre_boss_desk_stand_PRINT_3.stl
          git commit -m "Regenerate stand for 0.5 mm boss correction"
          git push origin HEAD:fix/p4-boss-outward-half-mm
