name: Temporary compact hinge regeneration

on:
  push:
    branches:
      - feat/compact-hinge-support
    paths:
      - .github/workflows/regen-compact-hinge.yml

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/compact-hinge-support

      - name: Install OpenSCAD and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Regenerate affected hinge STLs
        working-directory: hardware/enclosure/direct-mount/hinge-prototype-v2
        run: |
          set -euo pipefail
          openscad -o stl/02_middle_stationary_enclosure_HINGE_TEST.stl 02_middle_stationary_enclosure_HINGE_TEST.scad
          openscad -o stl/03_left_controller_end_enclosure_HINGE_TEST.stl 03_left_controller_end_enclosure_HINGE_TEST.scad
          openscad -o stl/04_right_power_end_enclosure_HINGE_TEST.stl 04_right_power_end_enclosure_HINGE_TEST.scad

      - name: Diagnose 60-degree sweep intersection
        run: |
          cat > /tmp/sweep60.scad <<'EOF'
          include <${PWD}/hardware/enclosure/direct-mount/hinge-prototype-v2/hinge_prototype_v2.scad>;
          intersection() {
              stationary_middle_enclosure_installed();
              translate([0,hinge_axis_y,hinge_axis_z])
                  rotate([-60,0,0])
                      translate([0,-hinge_axis_y,-hinge_axis_z])
                          moving_panel_template_installed();
          }
          EOF
          openscad -o /tmp/sweep60.stl /tmp/sweep60.scad
          python - <<'PY'
          import trimesh
          mesh = trimesh.load_mesh('/tmp/sweep60.stl', process=True)
          print('intersection_bounds_mm=', mesh.bounds.tolist())
          print('intersection_extents_mm=', mesh.extents.tolist())
          print('intersection_volume_mm3=', float(mesh.volume))
          PY

      - name: Run hinge v2 validator
        run: python hardware/enclosure/direct-mount/scripts/validate_hinge_v2_stls.py

      - name: Commit regenerated STLs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/02_middle_stationary_enclosure_HINGE_TEST.stl
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/03_left_controller_end_enclosure_HINGE_TEST.stl
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/04_right_power_end_enclosure_HINGE_TEST.stl
          if git diff --cached --quiet; then
            echo "Tracked STLs already current."
            exit 0
          fi
          git commit -m "Regenerate compact hinge support STLs"
          git push origin HEAD:feat/compact-hinge-support
