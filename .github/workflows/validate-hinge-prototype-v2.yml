name: Hinge Prototype V2 / Validate

on:
  pull_request:
    paths:
      - 'hardware/enclosure/direct-mount/direct_mount_enclosure.scad'
      - 'hardware/enclosure/direct-mount/hinge-prototype-v2/**'
      - '.github/workflows/validate-hinge-prototype-v2.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/direct-mount/direct_mount_enclosure.scad'
      - 'hardware/enclosure/direct-mount/hinge-prototype-v2/**'
      - '.github/workflows/validate-hinge-prototype-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Render printable hinge prototype parts
        shell: bash
        run: |
          set -euo pipefail
          dir=hardware/enclosure/direct-mount/hinge-prototype-v2
          out="$(mktemp -d)"

          openscad -o "$out/fixed.stl" "$dir/01_fixed_backplane_HINGE_V2.scad"
          openscad -o "$out/moving.stl" "$dir/02_moving_enclosure_HINGE_V2.scad"
          openscad -o "$out/coupon.stl" "$dir/03_hinge_fit_coupon_HINGE_V2.scad"
          openscad -o "$out/closed.csg" "$dir/00_closed_assembly_HINGE_V2.scad"
          openscad -o "$out/open.csg" "$dir/00_open_assembly_HINGE_V2.scad"

          test -s "$out/fixed.stl"
          test -s "$out/moving.stl"
          test -s "$out/coupon.stl"
          test -s "$out/closed.csg"
          test -s "$out/open.csg"

          python - "$out/fixed.stl" "$out/moving.stl" <<'PY'
          import math
          import sys
          from collections import defaultdict

          def inspect(path):
              triangles = []
              tri = []
              mins = [float('inf')] * 3
              maxs = [float('-inf')] * 3
              with open(path, encoding='utf-8', errors='strict') as handle:
                  for raw in handle:
                      line = raw.strip()
                      if not line.startswith('vertex '):
                          continue
                      _, xs, ys, zs = line.split()
                      vertex = tuple(float(v) for v in (xs, ys, zs))
                      for axis, value in enumerate(vertex):
                          mins[axis] = min(mins[axis], value)
                          maxs[axis] = max(maxs[axis], value)
                      tri.append(vertex)
                      if len(tri) == 3:
                          triangles.append(tuple(tri))
                          tri = []
              if tri:
                  raise SystemExit(f'incomplete STL triangle in {path}')
              return triangles, mins, maxs

          def downward_surfaces(triangles):
              area_by_z = defaultdict(float)
              for a, b, c in triangles:
                  ab = tuple(b[i] - a[i] for i in range(3))
                  ac = tuple(c[i] - a[i] for i in range(3))
                  normal = (
                      ab[1] * ac[2] - ab[2] * ac[1],
                      ab[2] * ac[0] - ab[0] * ac[2],
                      ab[0] * ac[1] - ab[1] * ac[0],
                  )
                  mag = math.sqrt(sum(value * value for value in normal))
                  if not mag:
                      continue
                  if normal[2] / mag < -0.9999:
                      z = round((a[2] + b[2] + c[2]) / 3.0, 3)
                      if z > 0.05:
                          area_by_z[z] += mag / 2.0
              return area_by_z

          fixed_tris, fixed_min, fixed_max = inspect(sys.argv[1])
          moving_tris, moving_min, moving_max = inspect(sys.argv[2])

          moving_dims = tuple(moving_max[i] - moving_min[i] for i in range(3))
          expected = (255.0, 127.0, 30.9)
          if any(abs(actual - target) > 0.25 for actual, target in zip(moving_dims, expected)):
              raise SystemExit(
                  f'moving enclosure print orientation changed: {moving_dims}, expected~={expected}'
              )
          if abs(moving_min[2]) > 0.05:
              raise SystemExit(f'moving enclosure does not sit on print Z=0: {moving_min[2]}')

          moving_down = downward_surfaces(moving_tris)
          if max(moving_down.values(), default=0.0) > 1.0:
              raise SystemExit(
                  'moving enclosure has an elevated downward-facing start surface: '
                  f'{max(moving_down.values()):.1f} mm^2'
              )

          # Production screw wells/holes create small legitimate downward faces
          # on the fixed backplane. Guard specifically against reintroducing the
          # previous full hinge-lug cantilever (564 mm^2 in this prototype).
          fixed_down = downward_surfaces(fixed_tris)
          if max(fixed_down.values(), default=0.0) > 250.0:
              raise SystemExit(
                  'fixed hinge prototype has a large elevated downward-facing surface: '
                  f'{max(fixed_down.values()):.1f} mm^2'
              )

          print(f'OK: moving print bounds {moving_dims}')
          print(
              'OK: largest elevated downward face: '
              f"fixed={max(fixed_down.values(), default=0.0):.1f} mm^2, "
              f"moving={max(moving_down.values(), default=0.0):.1f} mm^2"
          )
          PY

      - name: Verify closed and opening-sweep clearances
        shell: bash
        run: |
          set -euo pipefail
          dir=hardware/enclosure/direct-mount/hinge-prototype-v2
          out="$(mktemp -d)"

          assert_empty_intersection() {
            local scad="$1"
            local stl="$2"
            local label="$3"
            local log="$out/$(basename "$stl").log"

            # OpenSCAD deliberately exits non-zero when an STL export is empty.
            # For an intersection check that is the SUCCESS condition, provided
            # the log explicitly confirms that the top-level object is empty.
            if openscad -o "$stl" "$scad" >"$log" 2>&1; then
              if [ -s "$stl" ]; then
                cat "$log"
                echo "$label produced collision geometry." >&2
                exit 1
              fi
              cat "$log"
              echo "$label unexpectedly returned success without an STL." >&2
              exit 1
            fi

            if grep -q 'Current top level object is empty' "$log" && [ ! -s "$stl" ]; then
              echo "OK: $label is empty."
              return 0
            fi

            cat "$log"
            echo "$label failed for a reason other than an empty intersection." >&2
            exit 1
          }

          assert_empty_intersection             "$dir/98_closed_intersection_CHECK.scad"             "$out/closed-intersection.stl"             'closed fixed/moving intersection'

          assert_empty_intersection             "$dir/99_collision_sweep_CHECK.scad"             "$out/sweep-intersection.stl"             '5..90 degree opening-sweep intersection'

          echo 'OK: closed position and 5/15/30/45/60/75/90 degree sweep are collision-free.'
