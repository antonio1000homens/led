name: PR 165 / Refresh measured C14 left STL

on:
  push:
    branches:
      - feat/c14-left-side-inlet
    paths:
      - '.github/workflows/pr165-refresh-measured-c14-stl.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate canonical left side STL
        run: |
          openscad \
            -o hardware/enclosure/stl/04_left_equipment_side_PRINT_1.stl \
            hardware/enclosure/parts/04_left_equipment_side_PRINT_1.scad

      - name: Commit regenerated STL
        shell: bash
        run: |
          set -euo pipefail
          git add hardware/enclosure/stl/04_left_equipment_side_PRINT_1.stl
          if git diff --cached --quiet; then
            echo "Canonical left-side STL already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate measured C14 left-side STL"
          git push origin "HEAD:${GITHUB_REF_NAME}"
