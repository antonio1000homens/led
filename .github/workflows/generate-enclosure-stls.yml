name: Enclosure / Validate

# OpenSCAD generation + mechanical validation only. CI never invokes Bambu
# Studio/Windsor and never creates .3mf slice output.
#
# Canonical STLs are versioned in hardware/enclosure/stl/. CI
# regenerates OpenSCAD meshes for validation and exposes that generated set as a
# downloadable workflow artifact.

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
      - '.github/workflows/generate-enclosure-stls.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: write

# Mechanical validation is relatively expensive. A newer commit on the same
# branch/PR makes an older run obsolete, so cancel the superseded run.
concurrency:
  group: enclosure-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenSCAD and mechanical validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Generate canonical STL outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/enclosure-stls
          for source in hardware/enclosure/parts/*_PRINT_1.scad; do
            output="build/enclosure-stls/$(basename "${source%.scad}.stl")"
            openscad -o "$output" "$source"
          done

      - name: Refresh shorter-foot canonical backplane STL
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/shorter-backplane-stabiliser-feet' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/shorter-backplane-stabiliser-feet
          git checkout -B fix/shorter-backplane-stabiliser-feet origin/fix/shorter-backplane-stabiliser-feet
          cp build/enclosure-stls/03_universal_equipment_backplane_PRINT_1.stl \
            hardware/enclosure/stl/03_universal_equipment_backplane_PRINT_1.stl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/stl/03_universal_equipment_backplane_PRINT_1.stl
          if git diff --cached --quiet; then
            echo "Canonical universal backplane STL already current"
            exit 0
          fi
          git commit -m "chore(enclosure): refresh shorter-foot backplane STL"
          git push origin HEAD:fix/shorter-backplane-stabiliser-feet

      - name: Upload generated STL validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: enclosure-stls
          path: build/enclosure-stls/*.stl
          if-no-files-found: error
          retention-days: 14

      - name: Verify checked-in canonical STLs are current
        run: python hardware/enclosure/scripts/verify_canonical_stls.py

      - name: Validate current enclosure design
        run: python hardware/enclosure/scripts/validate_enclosure.py
