name: Enclosure / Validate

# OpenSCAD generation + mechanical validation only. CI never invokes Bambu
# Studio/Windsor and never creates .3mf slice output.
#
# Canonical STLs are versioned in hardware/enclosure/stl/. CI
# regenerates OpenSCAD meshes for validation and exposes that generated set as a
# downloadable workflow artifact.
#
# LOOP SAFETY: this workflow is intentionally read-only. It MUST NOT commit or
# push generated STL files. A SCAD/STL change may trigger validation once, but
# validation can never create a new repository change that triggers itself.

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
      - '.github/workflows/generate-enclosure-stls.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
  workflow_dispatch:

permissions:
  contents: read

# Mechanical validation is relatively expensive. A newer commit on the same
# branch/PR makes an older run obsolete, so cancel the superseded run.
concurrency:
  group: enclosure-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenSCAD and mechanical validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Validate experimental PSU SCAD entry points
        shell: bash
        run: |
          set -euo pipefail
          for source in \
            hardware/enclosure/powersupply/01_service_tray_snap_latch.scad \
            hardware/enclosure/powersupply/02_service_tray_snap_dock_PRINT_1.scad \
            hardware/enclosure/powersupply/03_service_tray_snap_tray_PRINT_1.scad \
            hardware/enclosure/powersupply/05_backplane_fit_preview.scad \
            hardware/enclosure/powersupply/06_boss_heatset_insert_test.scad; do
            output="/tmp/$(basename "${source%.scad}.stl")"
            openscad -o "$output" "$source"
            test -s "$output"
          done

      - name: Generate canonical STL outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/enclosure-stls
          for source in hardware/enclosure/parts/*_PRINT_1.scad; do
            output="build/enclosure-stls/$(basename "${source%.scad}.stl")"
            openscad -o "$output" "$source"
          done

      - name: Generate selected PSU service-tray STL outputs
        shell: bash
        run: |
          set -euo pipefail
          openscad -o build/enclosure-stls/06_psu_service_tray_snap_dock_PRINT_1.stl \
            hardware/enclosure/powersupply/02_service_tray_snap_dock_PRINT_1.scad
          openscad -o build/enclosure-stls/07_psu_service_tray_snap_tray_PRINT_1.stl \
            hardware/enclosure/powersupply/03_service_tray_snap_tray_PRINT_1.scad

      - name: Upload generated STL validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: enclosure-stls
          path: build/enclosure-stls/*.stl
          if-no-files-found: error
          retention-days: 14

      - name: Validate PSU dock interface and flexure geometry
        run: python hardware/enclosure/scripts/validate_psu_adapter.py --generated-dir build/enclosure-stls

      - name: Verify checked-in canonical STLs are current
        run: python hardware/enclosure/scripts/verify_canonical_stls.py

      - name: Validate current enclosure design
        run: python hardware/enclosure/scripts/validate_enclosure.py --generated-dir build/enclosure-stls --workers 4
