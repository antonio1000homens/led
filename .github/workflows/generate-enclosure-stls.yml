name: Generate enclosure STLs

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.md'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: \${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Generate direct-mount STL set
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount
          mkdir -p "$out"

          declare -A parts=(
            [backplane]=01_backplane_module_PRINT_4.stl
            [joiner]=02_module_joiner_PRINT_3.stl
            [rod_plug]=03_rod_end_plug_PRINT_4.stl
            [matrixportal_mount]=04_matrixportal_mount_PRINT_1.stl
            [power_mount]=05_power_distribution_mount_PRINT_1.stl
            [cable_clip]=06_cable_clip_PRINT_8.stl
            [slot_coupon]=07_mounting_slot_coupon_PRINT_1.stl
            [mount_pattern_template]=08_mount_pattern_template_PRINT_1.stl
          )

          for part in "\${!parts[@]}"; do
            openscad -D "part=\\"\${part}\\"" -o "$out/\${parts[$part]}" "$src"
          done

      - name: Commit generated STLs to pull-request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hardware/enclosure && \
             [ -z "$(git ls-files --others --exclude-standard hardware/enclosure | grep '\.stl$' || true)" ]; then
            echo "STLs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'hardware/enclosure/**/*.stl'
          git commit -m "Issue #53: generate direct-mount enclosure STLs"
          git push origin "HEAD:\${{ github.head_ref }}"
