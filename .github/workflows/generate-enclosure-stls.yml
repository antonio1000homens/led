name: Enclosure / Validate

# Validation-only by design. CI never commits generated STL files.
# If a temporary/manual workflow must commit generated files, its commit message
# must contain [skip ci] so github-actions[bot] does not re-trigger PR workflows.
#
# All enclosure checks are orchestrated by validate_enclosure.py so the exact
# same validation can be run locally and production meshes are rendered only
# once per CI run.

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.github/workflows/generate-enclosure-stls.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: read

# Mechanical validation is relatively expensive. A newer commit on the same
# branch/PR makes an older run obsolete, so cancel the superseded run.
concurrency:
  group: enclosure-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenSCAD and mechanical validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Validate current enclosure design
        run: python hardware/enclosure/direct-mount/scripts/validate_enclosure.py
