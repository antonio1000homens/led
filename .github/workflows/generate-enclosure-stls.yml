name: Generate enclosure STLs

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Generate direct-mount STL
        run: |
          mkdir -p hardware/enclosure/direct-mount
          openscad             -o hardware/enclosure/direct-mount/backplane_module.stl             hardware/enclosure/direct-mount/backplane_module.scad

      - name: Generate legacy side-loading STL set
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/legacy-side-loading/side_load_enclosure.scad
          out=hardware/enclosure/legacy-side-loading
          mkdir -p "$out"

          declare -A parts=(
            [frame]=01_frame_module_256mm_PRINT_4.stl
            [left_cap]=02_left_end_cap_PRINT_1.stl
            [right_cap]=03_right_end_cap_PRINT_1.stl
            [rod_clip]=04_rod_retainer_clip_PRINT_8.stl
            [seam_lock]=05_module_seam_bridge_panel_stop_PRINT_3.stl
            [controller_tray]=06_controller_tray_PRINT_1.stl
            [power_tray]=07_power_distribution_tray_PRINT_1.stl
            [cable_clip]=08_cable_clip_PRINT_8.stl
            [thickness_gauge]=09_panel_thickness_gauge_PRINT_FIRST.stl
            [joint_coupon]=10_joint_fit_coupon_PRINT_2.stl
            [assembly]=90_assembly_reference_DO_NOT_PRINT.stl
            [assembly_exploded]=91_exploded_reference_DO_NOT_PRINT.stl
          )

          for part in "${!parts[@]}"; do
            openscad -D "part=\"${part}\"" -o "$out/${parts[$part]}" "$src"
          done

      - name: Commit generated STLs to pull-request branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hardware/enclosure '*.stl' &&              [ -z "$(git ls-files --others --exclude-standard hardware/enclosure | grep '\.stl$' || true)" ]; then
            echo "STLs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'hardware/enclosure/**/*.stl'
          git commit -m "Issue #53: generate enclosure STL files"
          git push origin "HEAD:${{ github.head_ref }}"
