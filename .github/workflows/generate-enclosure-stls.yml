name: Enclosure / Validate

# Validation-only by design. Do not commit generated artifacts from this PR workflow.
# If a temporary/manual workflow must commit generated files, its commit message
# must contain [skip ci] so github-actions[bot] does not re-trigger PR workflows.

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.github/workflows/generate-enclosure-stls.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OpenSCAD and Python tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad python3-venv

      - name: Reject superseded PRINT_4 backplane artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n '01_backplane_module_PRINT_4' -- 'hardware/enclosure/direct-mount'; then
            echo 'Superseded PRINT_4 backplane artifact/reference found. Use PRINT_3 plus the right-end variant.' >&2
            exit 1
          fi

      - name: Regenerate and verify checked-in STLs
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          tracked=hardware/enclosure/direct-mount
          parts_dir="$tracked/parts"
          scripts_dir="$tracked/scripts"
          stl_dir="$tracked/stl"
          generated="$(mktemp -d)"

          declare -A parts=(
            [backplane]=01_backplane_module_PRINT_3.stl
            [backplane_right]=01b_backplane_right_end_PRINT_1.stl
            [joiner]=02_module_joiner_PRINT_4.stl
            [rod_plug]=03_rod_end_plug_PRINT_4.stl
            [matrixportal_mount]=04_matrixportal_mount_PRINT_1.stl
            [power_mount]=05_power_distribution_mount_PRINT_1.stl
            [cable_clip]=06_cable_clip_PRINT_8.stl
            [slot_coupon]=07_mounting_slot_coupon_PRINT_1.stl
            [mount_pattern_template]=08_mount_pattern_template_PRINT_1.stl
            [centre_boss_stand]=09_centre_boss_desk_stand_PRINT_3.stl
            [rear_lid]=10_rear_lid_PRINT_4.stl
          )

          for part in "${!parts[@]}"; do
            openscad -D "part=\"${part}\"" -o "$generated/${parts[$part]}" "$src"
          done

          expected_list="$generated/expected.txt"
          actual_list="$generated/actual.txt"
          printf '%s\n' "${parts[@]}" | sort > "$expected_list"
          find "$stl_dir" -maxdepth 1 -type f -name '*.stl' -printf '%f\n' | sort > "$actual_list"

          if ! diff -u "$expected_list" "$actual_list"; then
            echo 'Checked-in STL file set does not match the expected generated set.' >&2
            exit 1
          fi

          canonical_hash() {
            python - "$1" <<'PY'
          import hashlib
          import sys

          path = sys.argv[1]
          triangles = []
          vertices = []

          with open(path, encoding="utf-8", errors="strict") as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line.startswith("vertex "):
                      continue
                  _, xs, ys, zs = line.split()
                  vertex = tuple(round(float(value), 6) for value in (xs, ys, zs))
                  vertices.append(vertex)
                  if len(vertices) == 3:
                      triangles.append(tuple(sorted(vertices)))
                      vertices = []

          if vertices:
              raise SystemExit(f"incomplete triangle data in {path}")

          payload = repr(sorted(triangles)).encode("utf-8")
          print(hashlib.sha256(payload).hexdigest())
          PY
          }

          status=0
          for filename in "${parts[@]}"; do
            tracked_hash="$(canonical_hash "$stl_dir/$filename")"
            generated_hash="$(canonical_hash "$generated/$filename")"
            if [ "$tracked_hash" != "$generated_hash" ]; then
              echo "STALE: $stl_dir/$filename" >&2
              status=1
            else
              echo "OK: $stl_dir/$filename"
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo >&2
            echo 'One or more checked-in STLs are geometrically different from direct_mount_enclosure.scad.' >&2
            echo 'Regenerate the STL set locally with OpenSCAD and commit the updated binaries.' >&2
            exit "$status"
          fi

          python3 "$scripts_dir/validate_matrixportal_stl.py" \
            "$generated/04_matrixportal_mount_PRINT_1.stl"

      - name: Verify individual OpenSCAD component entrypoints
        shell: bash
        run: |
          set -euo pipefail
          tracked=hardware/enclosure/direct-mount
          parts_dir="$tracked/parts"
          scripts_dir="$tracked/scripts"
          stl_dir="$tracked/stl"
          schematics="$tracked/schematics"
          assembly=hardware/enclosure/complete_enclosure
          generated="$(mktemp -d)"

          declare -A entrypoints=(
            [01_backplane_module_PRINT_3.scad]=01_backplane_module_PRINT_3.stl
            [01b_backplane_right_end_PRINT_1.scad]=01b_backplane_right_end_PRINT_1.stl
            [02_module_joiner_PRINT_4.scad]=02_module_joiner_PRINT_4.stl
            [03_rod_end_plug_PRINT_4.scad]=03_rod_end_plug_PRINT_4.stl
            [04_matrixportal_mount_PRINT_1.scad]=04_matrixportal_mount_PRINT_1.stl
            [05_power_distribution_mount_PRINT_1.scad]=05_power_distribution_mount_PRINT_1.stl
            [06_cable_clip_PRINT_8.scad]=06_cable_clip_PRINT_8.stl
            [07_mounting_slot_coupon_PRINT_1.scad]=07_mounting_slot_coupon_PRINT_1.stl
            [08_mount_pattern_template_PRINT_1.scad]=08_mount_pattern_template_PRINT_1.stl
            [09_centre_boss_desk_stand_PRINT_3.scad]=09_centre_boss_desk_stand_PRINT_3.stl
            [10_rear_lid_PRINT_4.scad]=10_rear_lid_PRINT_4.stl
          )

          canonical_hash() {
            python - "$1" <<'PY'
          import hashlib
          import sys

          triangles = []
          vertices = []
          with open(sys.argv[1], encoding="utf-8", errors="strict") as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line.startswith("vertex "):
                      continue
                  _, xs, ys, zs = line.split()
                  vertex = tuple(round(float(value), 6) for value in (xs, ys, zs))
                  vertices.append(vertex)
                  if len(vertices) == 3:
                      triangles.append(tuple(sorted(vertices)))
                      vertices = []
          if vertices:
              raise SystemExit(f"incomplete triangle data in {sys.argv[1]}")
          print(hashlib.sha256(repr(sorted(triangles)).encode()).hexdigest())
          PY
          }

          for scad in "${!entrypoints[@]}"; do
            stl="${entrypoints[$scad]}"
            openscad -o "$generated/$stl" "$parts_dir/$scad"
            if [ "$(canonical_hash "$generated/$stl")" != "$(canonical_hash "$stl_dir/$stl")" ]; then
              echo "Entry point $scad does not reproduce $stl" >&2
              exit 1
            fi
            echo "OK: $scad -> $stl"
          done

          # Parse/render assembly previews as CSG so their geometry/placement files
          # remain syntactically valid in CI without producing extra printable STLs.
          openscad -o "$generated/matrixportal_side_access_preview.csg" \
            "$schematics/04_matrixportal_side_access_ASSEMBLY.scad"
          openscad -o "$generated/rear_lid_alignment_preview.csg" \
            "$schematics/10_rear_lid_alignment_ASSEMBLY.scad"
          openscad -o "$generated/complete_enclosure_assembly.csg" \
            "$assembly/00_complete_enclosure_ASSEMBLY.scad"

          declare -a svg_views=(
            00_complete_enclosure_FRONT_VIEW_SVG.scad
            00_complete_enclosure_BACK_VIEW_SVG.scad
            00_complete_enclosure_LEFT_SIDE_VIEW_SVG.scad
            00_complete_enclosure_RIGHT_SIDE_VIEW_SVG.scad
            00_complete_enclosure_TOP_VIEW_SVG.scad
            00_complete_enclosure_BOTTOM_VIEW_SVG.scad
          )

          for view in "${svg_views[@]}"; do
            out="$generated/${view%.scad}.svg"
            openscad -o "$out" "$assembly/$view"
            test -s "$out"
            grep -q '<svg' "$out"
            echo "OK: $view -> SVG"
          done

      - name: Validate 6 mm rail hinge prototype
        shell: bash
        run: |
          set -euo pipefail
          hinge_dir=hardware/enclosure/direct-mount/hinge-version
          generated="$(mktemp -d)"

          canonical_hash() {
            python - "$1" <<'PY'
          import hashlib
          import sys

          triangles = []
          vertices = []
          with open(sys.argv[1], encoding="utf-8", errors="strict") as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line.startswith("vertex "):
                      continue
                  _, xs, ys, zs = line.split()
                  vertex = tuple(round(float(value), 6) for value in (xs, ys, zs))
                  vertices.append(vertex)
                  if len(vertices) == 3:
                      triangles.append(tuple(sorted(vertices)))
                      vertices = []
          if vertices:
              raise SystemExit(f"incomplete triangle data in {sys.argv[1]}")
          print(hashlib.sha256(repr(sorted(triangles)).encode()).hexdigest())
          PY
          }

          declare -A hinge_parts=(
            [08_mount_pattern_template_HINGE_PRINT_1.scad]=08_mount_pattern_template_HINGE_PRINT_1.stl
            [11_hinged_equipment_enclosure_PRINT_1.scad]=11_hinged_equipment_enclosure_PRINT_1.stl
          )

          for scad in "${!hinge_parts[@]}"; do
            stl="${hinge_parts[$scad]}"
            openscad -o "$generated/$stl" "$hinge_dir/$scad"
            if [ "$(canonical_hash "$generated/$stl")" != "$(canonical_hash "$hinge_dir/stl/$stl")" ]; then
              echo "Hinge prototype entry point $scad does not reproduce $stl" >&2
              exit 1
            fi
            echo "OK: hinge-version/$scad -> stl/$stl"
          done

          # Guard the moving enclosure's slicer-friendly export orientation.
          # This is not a full slicer simulation, but it catches the two regressions
          # that caused Bambu Studio floating-region warnings: exporting the open
          # cavity face-down and introducing a large horizontal underside above bed.
          python - "$generated/11_hinged_equipment_enclosure_PRINT_1.stl" <<'PY'
          import math
          import sys
          from collections import defaultdict

          path = sys.argv[1]
          triangles = []
          tri = []
          mins = [float("inf")] * 3
          maxs = [float("-inf")] * 3

          with open(path, encoding="utf-8", errors="strict") as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line.startswith("vertex "):
                      continue
                  _, xs, ys, zs = line.split()
                  vertex = tuple(float(v) for v in (xs, ys, zs))
                  for axis, value in enumerate(vertex):
                      mins[axis] = min(mins[axis], value)
                      maxs[axis] = max(maxs[axis], value)
                  tri.append(vertex)
                  if len(tri) == 3:
                      triangles.append(tuple(tri))
                      tri = []

          dims = tuple(maxs[i] - mins[i] for i in range(3))
          expected = (57.4, 127.0, 255.0)
          if any(abs(actual - target) > 0.25 for actual, target in zip(dims, expected)):
              raise SystemExit(
                  f"moving enclosure is no longer in side-print orientation: "
                  f"dimensions={dims}, expected~={expected}"
              )
          if abs(mins[2]) > 0.05:
              raise SystemExit(f"moving enclosure does not sit on print Z=0: min_z={mins[2]}")

          def sub(a, b):
              return tuple(a[i] - b[i] for i in range(3))

          def cross(a, b):
              return (
                  a[1] * b[2] - a[2] * b[1],
                  a[2] * b[0] - a[0] * b[2],
                  a[0] * b[1] - a[1] * b[0],
              )

          downward_by_z = defaultdict(float)
          for a, b, c in triangles:
              ab = sub(b, a)
              ac = sub(c, a)
              normal = cross(ab, ac)
              mag = math.sqrt(sum(value * value for value in normal))
              if not mag:
                  continue
              nz = normal[2] / mag
              if nz < -0.9999:
                  z = round((a[2] + b[2] + c[2]) / 3.0, 3)
                  if z > 0.05:
                      downward_by_z[z] += mag / 2.0

          largest = max(downward_by_z.values(), default=0.0)
          if largest > 1000.0:
              raise SystemExit(
                  f"moving enclosure has a large downward horizontal start surface: "
                  f"{largest:.1f} mm^2 (limit 1000 mm^2)"
              )

          print(
              "OK: moving enclosure print orientation "
              f"{dims[0]:.1f} x {dims[1]:.1f} x {dims[2]:.1f} mm; "
              f"largest elevated downward-horizontal surface {largest:.1f} mm^2"
          )
          PY

          openscad -o "$generated/hinge_version_assembly.csg" \
            "$hinge_dir/00_hinge_version_ASSEMBLY.scad"
          openscad -o "$generated/hinge_version_closed_assembly.csg" \
            "$hinge_dir/00_hinge_version_CLOSED_ASSEMBLY.scad"

      - name: Validate support-free hinge prototype v2
        run: python3 hardware/enclosure/direct-mount/scripts/validate_hinge_v2_stls.py

      - name: Validate mesh health and nominal assembly interfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-mechanical
          .venv-mechanical/bin/python -m pip install --disable-pip-version-check --quiet trimesh manifold3d numpy networkx
          .venv-mechanical/bin/python hardware/enclosure/direct-mount/scripts/validate_assembly.py hardware/enclosure/direct-mount/scripts/assembly_validation.json
