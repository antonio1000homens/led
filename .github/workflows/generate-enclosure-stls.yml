name: Enclosure / Validate

# OpenSCAD generation + mechanical validation only. CI never invokes Bambu
# Studio/Windsor and never creates .3mf slice output.
#
# Canonical STLs are versioned in hardware/enclosure/direct-mount/stl/. CI
# regenerates OpenSCAD meshes for validation and exposes that generated set as a
# downloadable workflow artifact.

on:
  pull_request:
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
      - '.github/workflows/generate-enclosure-stls.yml'
  push:
    branches:
      - master
    paths:
      - 'hardware/enclosure/**/*.scad'
      - 'hardware/enclosure/**/*.stl'
      - 'hardware/enclosure/**/*.py'
      - 'hardware/enclosure/**/*.json'
      - '.windsor-slicer.yaml'
      - '.github/workflows/generate-enclosure-stls.yml'
  workflow_dispatch:

permissions:
  contents: write

# Mechanical validation is relatively expensive. A newer commit on the same
# branch/PR makes an older run obsolete, so cancel the superseded run.
concurrency:
  group: enclosure-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install OpenSCAD and mechanical validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Generate canonical STL outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/enclosure-stls
          for source in hardware/enclosure/direct-mount/parts/*_PRINT_1.scad; do
            output="build/enclosure-stls/$(basename "${source%.scad}.stl")"
            openscad -o "$output" "$source"
          done

      - name: Upload generated STL validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enclosure-stls
          path: build/enclosure-stls/*.stl
          if-no-files-found: error
          retention-days: 14

      - name: Bootstrap canonical STL files for this PR
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/restore-pr119-hinge-architecture'
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          mkdir -p hardware/enclosure/direct-mount/stl
          cp build/enclosure-stls/*.stl hardware/enclosure/direct-mount/stl/
          git add hardware/enclosure/direct-mount/stl/*.stl
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore canonical generated STL outputs"
          git push origin "HEAD:$HEAD_REF"

      - name: Validate current enclosure design
        run: python hardware/enclosure/direct-mount/scripts/validate_enclosure.py
