name: One-off regenerate universal backplane STL

on:
  push:
    branches:
      - fix/universal-backplane-rib-slots
    paths:
      - '.github/workflows/one-off-regenerate-backplane-stl.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install OpenSCAD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate canonical universal backplane STL
        run: |
          set -euo pipefail
          openscad \
            -o hardware/enclosure/stl/03_universal_equipment_backplane_PRINT_1.stl \
            hardware/enclosure/parts/03_universal_equipment_backplane_PRINT_1.scad
          test -s hardware/enclosure/stl/03_universal_equipment_backplane_PRINT_1.stl

      - name: Commit generated STL and remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/one-off-regenerate-backplane-stl.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate universal equipment backplane STL"
          git push origin "HEAD:${GITHUB_REF_NAME}"
