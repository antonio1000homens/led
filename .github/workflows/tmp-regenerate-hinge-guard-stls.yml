name: Temporary / Regenerate hinge guard STLs

on:
  push:
    branches:
      - flash-events
    paths:
      - '.github/workflows/tmp-regenerate-hinge-guard-stls.yml'
      - 'hardware/enclosure/direct-mount/hinge-prototype-v2/**'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: flash-events

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate stationary hinge enclosure STLs
        shell: bash
        run: |
          set -euo pipefail
          dir=hardware/enclosure/direct-mount/hinge-prototype-v2
          openscad -o "$dir/stl/02_middle_stationary_enclosure_HINGE_TEST.stl" "$dir/02_middle_stationary_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/03_left_controller_end_enclosure_HINGE_TEST.stl" "$dir/03_left_controller_end_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/04_right_power_end_enclosure_HINGE_TEST.stl" "$dir/04_right_power_end_enclosure_HINGE_TEST.scad"

      - name: Commit regenerated meshes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/*.stl
          if git diff --cached --quiet; then
            echo "STLs already current"
            exit 0
          fi
          git commit -m "Regenerate hinge guard STL set [skip ci]"
          git push origin HEAD:flash-events
