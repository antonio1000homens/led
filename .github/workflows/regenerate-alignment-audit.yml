name: Enclosure / Regenerate alignment audit

on:
  push:
    branches:
      - fix/enclosure-alignment-and-layout
    paths:
      - '.github/workflows/regenerate-alignment-audit.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/enclosure-alignment-and-layout

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate affected STLs
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount/stl
          openscad -D 'part="joiner"' -o "$out/02_module_joiner_PRINT_4.stl" "$src"
          openscad -D 'part="matrixportal_mount"' -o "$out/04_matrixportal_mount_PRINT_1.stl" "$src"
          openscad -D 'part="rear_lid"' -o "$out/10_rear_lid_PRINT_4.stl" "$src"

      - name: Commit regenerated STLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             hardware/enclosure/direct-mount/stl/02_module_joiner_PRINT_4.stl             hardware/enclosure/direct-mount/stl/04_matrixportal_mount_PRINT_1.stl             hardware/enclosure/direct-mount/stl/10_rear_lid_PRINT_4.stl
          git commit -m "Regenerate aligned enclosure STLs"
          git push origin HEAD:fix/enclosure-alignment-and-layout
