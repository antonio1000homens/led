name: Temporary enclosure STL sync
# one-shot regeneration for PR #145 connector/hinge support correction

on:
  push:
    branches:
      - 'fix/144-bottom-edge-hinge'
    paths:
      - 'hardware/enclosure/direct-mount/direct_mount_enclosure.scad'
      - 'hardware/enclosure/direct-mount/parts/*.scad'
      - 'hardware/enclosure/direct-mount/scripts/*.py'
      - '.github/workflows/tmp-sync-enclosure-stls.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 'fix/144-bottom-edge-hinge'
          fetch-depth: 0

      - name: Install OpenSCAD and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
          python -m pip install --disable-pip-version-check --quiet \
            trimesh manifold3d numpy networkx scipy

      - name: Regenerate and validate canonical enclosure STLs
        run: |
          set -euo pipefail
          python hardware/enclosure/direct-mount/scripts/generate_stls.py
          python hardware/enclosure/direct-mount/scripts/validate_enclosure.py

      - name: Commit generated STL meshes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/stl/*.stl
          if git diff --cached --quiet; then
            echo "No STL changes to commit."
            exit 0
          fi
          git commit -m "Regenerate corrected enclosure STLs [skip ci]"
          git push origin HEAD:fix/144-bottom-edge-hinge
