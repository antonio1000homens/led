name: Cloud Slicer / Deploy Worker

on:
  pull_request:
    paths:
      - '.github/workflows/slicer-worker.yml'
      - 'cloud/slicer-worker/**'
      - 'infrastructure/bootstrap.yaml'
      - 'scripts/slicer/deploy-cloud-slicer-worker.sh'
      - 'tests/test_deployment_static.py'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/slicer-worker.yml'
      - 'cloud/slicer-worker/**'
      - 'scripts/slicer/deploy-cloud-slicer-worker.sh'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m unittest tests.test_deployment_static -v
      - run: bash -n scripts/slicer/deploy-cloud-slicer-worker.sh
      - run: node --check cloud/slicer-worker/src/index.js
      - run: node --test tests/test_slicer_worker.js
      - run: npm install --global wrangler@4.71.0
      - run: wrangler deploy --dry-run --config cloud/slicer-worker/wrangler.toml

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: led-cloud-slicer-worker
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-2
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::243857182133:role/led-github-cloud-slicer-deploy-role
          role-session-name: github-actions-cloud-slicer

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned Wrangler
        run: npm install --global wrangler@4.71.0

      - name: Validate deployment inputs
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CODESPACE_NAME"
          grep -Fq "CODESPACE_NAME = \"$CODESPACE_NAME\"" cloud/slicer-worker/wrangler.toml
          node --check cloud/slicer-worker/src/index.js
          wrangler deploy --dry-run --config cloud/slicer-worker/wrangler.toml

      - name: Deploy Worker and sync SSM secrets
        env:
          CODESPACE_NAME: ${{ vars.CODESPACE_NAME }}
        run: bash scripts/slicer/deploy-cloud-slicer-worker.sh
