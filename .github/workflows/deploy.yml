name: Backend / AWS + Cloudflare

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'publisher.py'
      - 'config_api.py'
      - 'runtime_config.py'
      - 'server.py'
      - 'queue_times.py'
      - 'weather.py'
      - 'todoist.py'
      - 'formatting.py'
      - 'fixtures.py'
      - 'requirements-server.txt'
      - 'infrastructure/**'
      - 'scripts/bootstrap-deployment-role.sh'
      - 'scripts/bootstrap-ssm-migration.sh'
      - 'scripts/bootstrap-todoist-oauth.py'
      - 'scripts/cloudflare_dns.py'
      - 'scripts/configure-cloudflare-dns.sh'
      - 'scripts/deploy-stack.sh'
      - 'scripts/deploy.sh'
      - 'scripts/load-ssm-secrets.sh'
      - 'scripts/package-lambda.sh'
      - 'scripts/request-acm-certificate.sh'
      - 'config/**'
      - '.env.example'
      - 'tests/test_combined_queue_admin.py'
      - 'tests/test_config_api.py'
      - 'tests/test_control_plane_infrastructure.py'
      - 'tests/test_formatting.py'
      - 'tests/test_infrastructure.py'
      - 'tests/test_issue38_ssm_migration.py'
      - 'tests/test_issue41_dashboard.py'
      - 'tests/test_models.py'
      - 'tests/test_pr28_deployment.py'
      - 'tests/test_pr37_review_regressions.py'
      - 'tests/test_publisher.py'
      - 'tests/test_queue_times.py'
      - 'tests/test_runtime_config.py'
      - 'tests/test_server.py'
      - 'tests/test_todoist.py'
      - 'tests/test_weather.py'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy.yml'
      - 'publisher.py'
      - 'config_api.py'
      - 'runtime_config.py'
      - 'server.py'
      - 'queue_times.py'
      - 'weather.py'
      - 'todoist.py'
      - 'formatting.py'
      - 'fixtures.py'
      - 'requirements-server.txt'
      - 'infrastructure/led-stack.yaml'
      - 'scripts/cloudflare_dns.py'
      - 'scripts/configure-cloudflare-dns.sh'
      - 'scripts/deploy-stack.sh'
      - 'scripts/load-ssm-secrets.sh'
      - 'scripts/package-lambda.sh'
      - 'scripts/request-acm-certificate.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  STACK_NAME: led-serverless
  DOMAIN_NAME: ${{ vars.LED_DOMAIN_NAME || 'led.alf-broadcast.co.uk' }}
  ZONE_NAME: ${{ vars.LED_CF_ZONE_NAME || 'alf-broadcast.co.uk' }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
  CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
  AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
  CLOUDFORMATION_ROLE_ARN: ${{ vars.CLOUDFORMATION_ROLE_ARN }}
  LED_DEPLOY_SSM_PREFIX: ${{ vars.LED_DEPLOY_SSM_PREFIX || '/led/deploy' }}
  LED_CALENDAR_SOURCE: "todoist"
  LED_TODOIST_CACHE_SECONDS: "${{ vars.LED_TODOIST_CACHE_SECONDS || '300' }}"
  LED_TODOIST_MAX_EVENTS: "${{ vars.LED_TODOIST_MAX_EVENTS || '6' }}"
  LED_TODOIST_FILTER_QUERY: "${{ vars.LED_TODOIST_FILTER_QUERY || 'date after: yesterday' }}"
  LED_TODOIST_TIMEZONE: "${{ vars.LED_TODOIST_TIMEZONE || 'Europe/London' }}"
  LED_CALENDAR_DURATION_SECONDS: "${{ vars.LED_CALENDAR_DURATION_SECONDS || '10' }}"
  LED_CALENDAR_PAGE_SECONDS: "${{ vars.LED_CALENDAR_PAGE_SECONDS || '5' }}"
  LED_CHESSINGTON_CACHE_SECONDS: "${{ vars.LED_CHESSINGTON_CACHE_SECONDS || '300' }}"
  LED_CHESSINGTON_RIDES: "${{ vars.LED_CHESSINGTON_RIDES }}"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-server.txt
      - run: python -m unittest discover -s tests -v

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: led-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate deployment configuration
        run: |
          python - <<'PY'
          import os
          import re

          if not os.environ.get("AWS_ROLE_TO_ASSUME", "").strip():
              raise SystemExit("AWS_ROLE_TO_ASSUME is required")
          if not os.environ.get("CLOUDFORMATION_ROLE_ARN", "").strip():
              raise SystemExit("CLOUDFORMATION_ROLE_ARN is required")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if not re.fullmatch(r"[0-9a-fA-F]{32}", account_id):
              raise SystemExit("CLOUDFLARE_ACCOUNT_ID must be the 32-character Windsor Cloudflare account ID")
          team_domain = os.environ.get("CF_ACCESS_TEAM_DOMAIN", "").strip()
          if not re.fullmatch(r"https://[A-Za-z0-9.-]+\.cloudflareaccess\.com/?", team_domain):
              raise SystemExit("CF_ACCESS_TEAM_DOMAIN must be the existing Cloudflare Access team domain")
          if len(os.environ.get("CF_ACCESS_AUD", "").strip()) < 16:
              raise SystemExit("CF_ACCESS_AUD must contain the existing Access application audience tag")
          ssm_prefix = os.environ.get("LED_DEPLOY_SSM_PREFIX", "").rstrip("/")
          if ssm_prefix != "/led/deploy" and not ssm_prefix.startswith("/led/deploy/"):
              raise SystemExit("LED_DEPLOY_SSM_PREFIX must stay within /led/deploy")
          calendar_source = os.environ.get("LED_CALENDAR_SOURCE", "off").strip()
          if calendar_source not in ("off", "todoist"):
              raise SystemExit("LED_CALENDAR_SOURCE must be off or todoist")
          PY

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-led-deploy

      - name: Load deployment secrets from SSM
        run: bash scripts/load-ssm-secrets.sh

      - name: Verify AWS identity and select dedicated code bucket
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          CODE_BUCKET="led-code-${AWS_REGION}-${ACCOUNT_ID}"
          aws s3api head-bucket --bucket "${CODE_BUCKET}"
          echo "CODE_BUCKET=${CODE_BUCKET}" >> "${GITHUB_ENV}"
          echo "AWS account: ${ACCOUNT_ID}"
          echo "Using dedicated LED code bucket: ${CODE_BUCKET}"

      - name: Request or reuse ACM certificate
        id: certificate
        run: |
          CERTIFICATE_ARN="$(bash scripts/request-acm-certificate.sh)"
          echo "certificate_arn=${CERTIFICATE_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Configure ACM validation in Windsor Cloudflare
        env:
          CERTIFICATE_ARN: ${{ steps.certificate.outputs.certificate_arn }}
        run: bash scripts/configure-cloudflare-dns.sh

      - name: Wait for ACM validation
        env:
          CERTIFICATE_ARN: ${{ steps.certificate.outputs.certificate_arn }}
        run: aws acm wait certificate-validated --region us-east-1 --certificate-arn "${CERTIFICATE_ARN}"

      - name: Package and upload Lambda
        id: package
        run: |
          CODE_KEY="$(bash scripts/package-lambda.sh)"
          echo "code_key=${CODE_KEY}" >> "${GITHUB_OUTPUT}"

      - name: Deploy AWS stack
        env:
          CERTIFICATE_ARN: ${{ steps.certificate.outputs.certificate_arn }}
          CODE_KEY: ${{ steps.package.outputs.code_key }}
        run: bash scripts/deploy-stack.sh

      - name: Deploy simulator and admin static content
        run: bash scripts/deploy-static.sh

      - name: Read stack outputs
        id: stack
        run: |
          output() {
            aws cloudformation describe-stacks \
              --region "${AWS_REGION}" \
              --stack-name "${STACK_NAME}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" \
              --output text
          }
          echo "publisher=$(output PublisherFunctionName)" >> "${GITHUB_OUTPUT}"
          echo "hosting_bucket=$(output HostingBucketName)" >> "${GITHUB_OUTPUT}"
          echo "runtime_table=$(output RuntimeConfigTableName)" >> "${GITHUB_OUTPUT}"
          echo "distribution_domain=$(output DistributionDomainName)" >> "${GITHUB_OUTPUT}"
          echo "distribution_id=$(output DistributionId)" >> "${GITHUB_OUTPUT}"

      - name: Publish initial screen snapshot
        run: |
          set +e
          for attempt in 1 2 3 4 5; do
            aws lambda invoke \
              --region "${AWS_REGION}" \
              --function-name "${{ steps.stack.outputs.publisher }}" \
              /tmp/led-publisher-response.json >/tmp/led-publisher-invoke.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            cat /tmp/led-publisher-invoke.log
            if ! grep -Eq 'TooManyRequestsException|ReservedFunctionConcurrentInvocationLimitExceeded|Rate Exceeded' /tmp/led-publisher-invoke.log; then
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done
          set -e
          python - <<'PY'
          import json
          with open('/tmp/led-publisher-response.json', encoding='utf-8') as handle:
              result = json.load(handle)
          if not result.get('published'):
              raise SystemExit('Initial publisher invocation did not report success')
          print('Initial LED screen snapshot published')
          PY

      - name: Verify Todoist screen is live
        if: env.LED_CALENDAR_SOURCE == 'todoist'
        run: |
          aws s3 cp "s3://${{ steps.stack.outputs.hosting_bucket }}/api/screens" /tmp/led-screens.json --only-show-errors
          python - <<'PY'
          import json
          with open('/tmp/led-screens.json', encoding='utf-8') as handle:
              payload = json.load(handle)
          calendar = next((screen for screen in payload.get('screens', []) if screen.get('id') == 'calendar'), None)
          if calendar is None:
              raise SystemExit('Todoist calendar screen was not published')
          if calendar.get('source') != 'todoist':
              raise SystemExit('Todoist calendar source is unavailable; verify /led/todoist/oauth in SSM Parameter Store')
          if calendar.get('stale'):
              raise SystemExit('Todoist calendar was published stale; check Lambda logs and OAuth state')
          print(f"Todoist calendar live with {len(calendar.get('events') or [])} upcoming event(s)")
          PY

      - name: Configure LED hostname in Windsor Cloudflare
        env:
          CLOUDFRONT_DOMAIN: ${{ steps.stack.outputs.distribution_domain }}
        run: bash scripts/configure-cloudflare-dns.sh

      - name: Invalidate published paths
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack.outputs.distribution_id }}" \
            --paths '/index.html' '/api/screens' '/admin' '/api/control/v1/*' >/dev/null
