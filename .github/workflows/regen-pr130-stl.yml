name: Temporary PR130 STL regeneration

on:
  push:
    branches:
      - fix/pr120-floating-cantilever
    paths:
      - .github/workflows/regen-pr130-stl.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/pr120-floating-cantilever

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate controller-end hinge STL
        working-directory: hardware/enclosure/direct-mount/hinge-prototype-v2
        run: |
          openscad \
            -o stl/03_left_controller_end_enclosure_HINGE_TEST.stl \
            03_left_controller_end_enclosure_HINGE_TEST.scad

      - name: Commit regenerated STL
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/03_left_controller_end_enclosure_HINGE_TEST.stl
          if git diff --cached --quiet; then
            echo "Tracked STL already current."
            exit 0
          fi
          git commit -m "Regenerate controller hinge STL"
          git push origin HEAD:fix/pr120-floating-cantilever
