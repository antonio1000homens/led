name: Enclosure / Regenerate branch STLs

on:
  push:
    branches:
      - fix/p4-boss-inset-and-centre-stand
    paths:
      - 'hardware/enclosure/**/*.scad'
      - '.github/workflows/regenerate-enclosure-branch-stls.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/p4-boss-inset-and-centre-stand

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate enclosure STLs
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount

          declare -A parts=(
            [backplane]=01_backplane_module_PRINT_3.stl
            [backplane_right]=01b_backplane_right_end_PRINT_1.stl
            [joiner]=02_module_joiner_PRINT_3.stl
            [rod_plug]=03_rod_end_plug_PRINT_4.stl
            [matrixportal_mount]=04_matrixportal_mount_PRINT_1.stl
            [power_mount]=05_power_distribution_mount_PRINT_1.stl
            [cable_clip]=06_cable_clip_PRINT_8.stl
            [slot_coupon]=07_mounting_slot_coupon_PRINT_1.stl
            [mount_pattern_template]=08_mount_pattern_template_PRINT_1.stl
            [centre_boss_stand]=09_centre_boss_desk_stand_PRINT_2.stl
          )

          for part in "${!parts[@]}"; do
            openscad -D "part=\"${part}\"" -o "$out/${parts[$part]}" "$src"
          done

      - name: Commit regenerated STLs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- hardware/enclosure/direct-mount/*.stl &&              ! git ls-files --others --exclude-standard 'hardware/enclosure/direct-mount/*.stl' | grep -q .; then
            echo "No STL changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/*.stl
          git commit -m "Regenerate corrected enclosure STLs"
          # The branch may have received documentation/source commits while
          # OpenSCAD was rendering; replay the STL commit onto the latest tip.
          git pull --rebase origin fix/p4-boss-inset-and-centre-stand
          git push origin HEAD:fix/p4-boss-inset-and-centre-stand
