name: Temporary / Regenerate hinge clearance STLs

on:
  push:
    paths:
      - '.github/workflows/tmp-regenerate-hinge-clearance.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.ref_name }}

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate hinge v2 STL set
        shell: bash
        run: |
          set -euo pipefail
          dir="hardware/enclosure/direct-mount/hinge-prototype-v2"
          mkdir -p "$dir/stl"
          openscad -o "$dir/stl/01_moving_panel_template_HINGE_TEST.stl" "$dir/01_moving_panel_template_HINGE_TEST.scad"
          openscad -o "$dir/stl/02_middle_stationary_enclosure_HINGE_TEST.stl" "$dir/02_middle_stationary_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/03_left_controller_end_enclosure_HINGE_TEST.stl" "$dir/03_left_controller_end_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/04_right_power_end_enclosure_HINGE_TEST.stl" "$dir/04_right_power_end_enclosure_HINGE_TEST.scad"

      - name: Commit regenerated meshes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl/*.stl
          if git diff --cached --quiet; then
            echo "STLs already current"
            exit 0
          fi
          git commit -m "Regenerate 15 mm-clearance hinge STLs [skip ci]"
          git push
