name: Enclosure / Regenerate shallow ribbon notch

on:
  push:
    branches:
      - fix/backplane-single-piece-cable-channel
    paths:
      - '.github/workflows/regenerate-shallow-ribbon.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/backplane-single-piece-cable-channel

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate affected STLs
        shell: bash
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount
          openscad -D 'part="backplane"' -o "$out/01_backplane_module_PRINT_3.stl" "$src"
          openscad -D 'part="backplane_right"' -o "$out/01b_backplane_right_end_PRINT_1.stl" "$src"
          openscad -D 'part="joiner"' -o "$out/02_module_joiner_PRINT_4.stl" "$src"

      - name: Commit regenerated STLs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             hardware/enclosure/direct-mount/01_backplane_module_PRINT_3.stl             hardware/enclosure/direct-mount/01b_backplane_right_end_PRINT_1.stl             hardware/enclosure/direct-mount/02_module_joiner_PRINT_4.stl
          git commit -m "Regenerate shallow ribbon-notch enclosure"
          git push origin HEAD:fix/backplane-single-piece-cable-channel
