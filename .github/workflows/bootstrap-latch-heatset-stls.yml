name: Temporary / Refresh latch heat-set STLs

on:
  pull_request:
    paths:
      - '.github/workflows/bootstrap-latch-heatset-stls.yml'
      - 'hardware/enclosure/powersupply/service_tray_snap_latch_common.scad'

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix-psu-dock-80mm-envelope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install OpenSCAD
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate affected canonical STLs
        run: |
          set -euo pipefail
          openscad -o hardware/enclosure/stl/06_psu_service_tray_snap_dock_PRINT_1.stl \
            hardware/enclosure/powersupply/02_service_tray_snap_dock_PRINT_1.scad
          openscad -o hardware/enclosure/stl/08_psu_service_tray_snap_latch_PRINT_1.stl \
            hardware/enclosure/powersupply/04_service_tray_snap_latch_PRINT_1.scad

      - name: Commit refreshed meshes once
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add \
            hardware/enclosure/stl/06_psu_service_tray_snap_dock_PRINT_1.stl \
            hardware/enclosure/stl/08_psu_service_tray_snap_latch_PRINT_1.stl

          if git diff --cached --quiet; then
            echo "Canonical latch/dock meshes are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(enclosure): refresh latch heat-set STLs [skip ci]"
          git push origin "HEAD:${HEAD_BRANCH}"
