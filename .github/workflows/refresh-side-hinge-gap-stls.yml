name: Refresh side STLs for hinge-gap cover

on:
  push:
    branches:
      - feat/side-hinge-gap-cover
    paths:
      - '.github/workflows/refresh-side-hinge-gap-stls.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      - name: Regenerate canonical side STLs
        run: |
          openscad -o hardware/enclosure/stl/04_left_equipment_side_PRINT_1.stl hardware/enclosure/parts/04_left_equipment_side_PRINT_1.scad
          openscad -o hardware/enclosure/stl/05_right_equipment_side_PRINT_1.stl hardware/enclosure/parts/05_right_equipment_side_PRINT_1.scad
      - name: Commit regenerated STLs
        shell: bash
        run: |
          set -euo pipefail
          git add hardware/enclosure/stl/04_left_equipment_side_PRINT_1.stl hardware/enclosure/stl/05_right_equipment_side_PRINT_1.stl
          if git diff --cached --quiet; then
            echo "Side STLs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate side STLs for hinge-gap cover [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
