name: Temporary / Regenerate stale hinge-version STL

on:
  push:
    branches:
      - flash-events
    paths:
      - '.github/workflows/tmp-regenerate-stale-hinge-version.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: flash-events

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate stale hinge-version mesh
        shell: bash
        run: |
          set -euo pipefail
          dir=hardware/enclosure/direct-mount/hinge-version
          openscad -o "$dir/stl/11_hinged_equipment_enclosure_PRINT_1.stl" "$dir/11_hinged_equipment_enclosure_PRINT_1.scad"

      - name: Commit regenerated mesh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/hinge-version/stl/11_hinged_equipment_enclosure_PRINT_1.stl
          if git diff --cached --quiet; then
            echo "STL already current"
            exit 0
          fi
          git commit -m "Regenerate stale hinge-version enclosure STL [skip ci]"
          git push origin HEAD:flash-events
