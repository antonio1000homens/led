name: Temporary / Generate hinge v2 STLs

on:
  push:
    branches:
      - feat/support-free-hinge-prototype-v2
    paths:
      - 'hardware/enclosure/direct-mount/hinge-prototype-v2/**/*.scad'
      - '.github/workflows/generate-hinge-v2-stls-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/support-free-hinge-prototype-v2
          fetch-depth: 0

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate hinge-v2 STLs
        shell: bash
        run: |
          set -euo pipefail
          dir=hardware/enclosure/direct-mount/hinge-prototype-v2
          mkdir -p "$dir/stl"

          openscad -o "$dir/stl/01_moving_panel_template_HINGE_TEST.stl"             "$dir/01_moving_panel_template_HINGE_TEST.scad"
          openscad -o "$dir/stl/02_middle_stationary_enclosure_HINGE_TEST.stl"             "$dir/02_middle_stationary_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/03_left_controller_end_enclosure_HINGE_TEST.stl"             "$dir/03_left_controller_end_enclosure_HINGE_TEST.scad"
          openscad -o "$dir/stl/04_right_power_end_enclosure_HINGE_TEST.stl"             "$dir/04_right_power_end_enclosure_HINGE_TEST.scad"

          # Parse the complete assembly previews too, so syntax/placement issues
          # fail before committing generated meshes.
          openscad -o /tmp/four_panel_closed.csg             "$dir/00_FOUR_PANEL_CLOSED_ASSEMBLY.scad"
          openscad -o /tmp/four_panel_open.csg             "$dir/00_FOUR_PANEL_OPEN_ASSEMBLY.scad"

      - name: Commit generated STLs
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- hardware/enclosure/direct-mount/hinge-prototype-v2/stl)" ]; then
            echo "Generated STL files are already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hardware/enclosure/direct-mount/hinge-prototype-v2/stl
          git commit -m "Regenerate complete hinge enclosure set [skip ci]"
          git push origin HEAD:feat/support-free-hinge-prototype-v2
