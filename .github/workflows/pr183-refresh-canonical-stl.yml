name: PR183 / Refresh canonical base STL

on:
  push:
    branches:
      - fix/issue-175-inward-guide-extensions

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/issue-175-inward-guide-extensions

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate affected canonical STL
        run: |
          openscad \
            -o hardware/enclosure/stl/02_hinged_equipment_base_PRINT_1.stl \
            hardware/enclosure/parts/02_hinged_equipment_base_PRINT_1.scad

      - name: Commit regenerated STL
        shell: bash
        run: |
          set -euo pipefail
          git add hardware/enclosure/stl/02_hinged_equipment_base_PRINT_1.stl
          if git diff --cached --quiet; then
            echo "Canonical STL already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh canonical base STL [skip ci]"
          git push origin HEAD:fix/issue-175-inward-guide-extensions
