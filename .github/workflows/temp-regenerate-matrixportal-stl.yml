name: Temporary regenerate MatrixPortal STL

on:
  push:
    branches:
      - fix/matrixportal-s3-mount
    paths:
      - 'hardware/enclosure/direct-mount/direct_mount_enclosure.scad'
      - '.github/workflows/temp-regenerate-matrixportal-stl.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/matrixportal-s3-mount

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Regenerate MatrixPortal S3 STL
        run: |
          set -euo pipefail
          src=hardware/enclosure/direct-mount/direct_mount_enclosure.scad
          out=hardware/enclosure/direct-mount/04_matrixportal_mount_PRINT_1.stl
          openscad -D 'part="matrixportal_mount"' -o "$out" "$src"

      - name: Commit regenerated STL
        run: |
          set -euo pipefail
          if git diff --quiet -- hardware/enclosure/direct-mount/04_matrixportal_mount_PRINT_1.stl; then
            echo "STL is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardware/enclosure/direct-mount/04_matrixportal_mount_PRINT_1.stl
          git commit -m "Regenerate corrected MatrixPortal S3 STL"
          git push
