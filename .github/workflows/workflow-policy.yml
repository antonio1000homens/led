name: Workflow / Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/WORKFLOWS.md'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'docs/WORKFLOWS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-commit-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prevent bot-generated PR approval loops
        shell: bash
        run: |
          set -euo pipefail

          status=0
          while IFS= read -r -d '' workflow; do
            if ! grep -Eq '(^|[[:space:]])git[[:space:]]+commit([[:space:]]|$)' "$workflow"; then
              continue
            fi

            if grep -Fqi '[skip ci]' "$workflow"; then
              echo "OK: $workflow contains git commit and a [skip ci] marker"
              continue
            fi

            echo "::error file=$workflow::Workflow contains a direct git commit but no [skip ci] marker. Bot-authored commits can re-trigger pull_request workflows and require maintainer approval."
            status=1
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          exit "$status"
