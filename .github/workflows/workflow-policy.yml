name: Workflow / Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/WORKFLOWS.md'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - 'docs/WORKFLOWS.md'
  workflow_dispatch:

permissions:
  contents: read

# New commits on the same pull request supersede stale validation runs.
# Non-PR runs fall back to github.run_id, so production/manual runs remain unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generated-commit-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Prevent bot-generated PR approval loops
        shell: bash
        run: |
          set -euo pipefail

          status=0
          while IFS= read -r -d '' workflow; do
            if ! grep -Eq '(^|[[:space:]])git[[:space:]]+commit([[:space:]]|$)' "$workflow"; then
              continue
            fi

            if grep -Fqi '[skip ci]' "$workflow"; then
              echo "OK: $workflow contains git commit and a [skip ci] marker"
              continue
            fi

            echo "::error file=$workflow::Workflow contains a direct git commit but no [skip ci] marker. Bot-authored commits can re-trigger pull_request workflows and require maintainer approval."
            status=1
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print0)

          exit "$status"

      - name: Protect enclosure validation from generated-commit loops
        shell: bash
        run: |
          set -euo pipefail

          workflow=".github/workflows/generate-enclosure-stls.yml"

          if grep -Eq '^[[:space:]]*contents:[[:space:]]*write([[:space:]]|$)' "$workflow"; then
            echo "::error file=$workflow::Enclosure validation must remain read-only; generated STL commits can create workflow loops."
            exit 1
          fi

          if grep -Eq '(^|[[:space:]])git[[:space:]]+(commit|push)([[:space:]]|$)' "$workflow"; then
            echo "::error file=$workflow::Enclosure validation must never commit or push generated STL files."
            exit 1
          fi

          echo "OK: enclosure validation is read-only and cannot self-commit generated STLs."
